# The crates.io crates mopm's Rust targets link: what Cargo is asked to resolve.
# Hand-written. Cargo.lock is what a GitHub runner resolved from it, never a
# developer box or the farm (.github/workflows/kpin-update.yml, KPIN_CARGO_SETS);
# crates.bzl is generated from the lock, the trimmed `cargo metadata`, sizes.txt
# and overrides.json by `kpin cargo` (README.md here). Nothing in this directory
# is compiled by Cargo: lib.rs is empty and only gives Cargo a target to resolve.
#
# A crate a target links must be a normal dependency here (kpin reads normal
# edges only), so a new crate is a line in this file, a runner run, and, when its
# build script has no entry, a line in cargo/overrides.json.

[package]
name = "mopm-third-party"
version = "0.0.0"
edition = "2021"
# Honoured by the runner's resolver (CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback): it
# picks the newest release of every crate whose own rust-version is at most this. It is NOT
# the pinned compiler (komira's tools/build/toolchains/rust is 1.99.0). The AWS SDK stack
# must be one coherent set that builds against AWS-LC 1.39.0 (see below), and a newest-first
# resolve against 1.99 mixes today's aws-smithy-types with an aws-runtime that no longer
# compiles with it. 1.85 is the rust-version of that older set; raising it moves the SDK and
# needs the AWS-LC decision first.
rust-version = "1.85"
publish = false

[lib]
path = "lib.rs"

[dependencies]
# Lambda runtime and event types (the API router is ours; aws_lambda_events only types the events).
lambda_runtime = { version = "1", default-features = false }
aws_lambda_events = { version = "1", default-features = false, features = ["apigw", "sqs"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "sync", "io-util"] }

# The AWS SDK for Rust. aws-lc-sys 0.23.1 bundles the AWS-LC that komira builds (1.39.0),
# and aws-lc-rs 1.11.1 and rustls 0.23.20 are the releases that go with it, so those three
# are held with `=` and Cargo resolves the SDK around them (the newest SDK releases it can
# resolve against that: the oldest ones do not compile with rustc 1.99). Moving the three
# is a decision (the AWS-LC pin in komira), not an update.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-cloudfront = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
serde_dynamo = { version = "4", features = ["aws-sdk-dynamodb+1"] }
rustls = { version = "=0.23.20", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
aws-lc-rs = { version = "=1.11.1", default-features = false, features = ["aws-lc-sys"] }
aws-lc-sys = { version = "=0.23.1", default-features = false }

# Data, errors, logs, time.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry", "fmt", "json"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }

# Encoding, hashing, randomness.
base64 = "0.23"
hex = "0.4"
sha2 = "0.11"
subtle = "2"
getrandom = "0.4"
percent-encoding = "2"
form_urlencoded = "1"
url = "2"

# Reading archives (the validator): pure Rust, no build script that compiles C.
ruzstd = "0.9"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
unicode-normalization = "0.1"

# HTTPS for GitHub (device login, the OIDC key set): hyper on the same rustls and AWS-LC as the SDK,
# system roots. Signature checks of CI identity tokens: jsonwebtoken on its pure-Rust backend (no C).
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "tls12", "aws-lc-rs"] }
http-body-util = "0.1"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
