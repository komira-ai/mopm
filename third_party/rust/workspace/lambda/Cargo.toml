[package]
name = "lambda"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
[dependencies]
lambda_runtime = { version = "*", default-features = false }
lambda_http = { version = "*", default-features = false, features = ["apigw_http"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
