# The Mojo environment the end-to-end tests run in (tests/e2e/run.sh). CI
# copies this file to a temporary directory and runs `pixi install` there with
# the pinned pixi (tools/install_pixi.sh). mojo and mojo-compiler are pinned to
# an exact version; pixi checks every download against the channel's sha256.
[workspace]
name = "mopm-e2e"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
mojo = "==1.0.0"
mojo-compiler = "==1.0.0"
python = "3.12.*"
