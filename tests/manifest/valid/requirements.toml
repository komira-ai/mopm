# Each form of version requirement (spec/mopm-toml.md, "Version requirements").
[package]
name = "example/reqs"
version = "0.1.0"

[dependencies]
"example/caret" = "1.2"
"example/explicit_caret" = "^0.4.1"
"example/tilde" = "~1.2"
"example/exact" = "=0.0.3"
"example/ranged" = ">=1.2, <1.5"
"example/anything" = "*"
"example/wild" = "1.*"
"example/pre" = { version = ">=2.0.0-rc.1" }

[dev-dependencies]
"example/spaced" = " >= 1 , < 2 "
