# A dependency with a path and a version: both are kept; lock, build and sync use the path, pack writes the version.
[package]
name = "example/both"
version = "0.1.0"

[toolchain]
mojo = "1.0.0"

[dependencies]
"example/util" = { path = "../util", version = "^0.3" }
"example/path_only" = { path = "../path_only" }
"example/version_only" = { version = "1.2" }

[dev-dependencies]
"example/testkit" = { version = ">=0.1, <0.2", path = "../testkit" }
