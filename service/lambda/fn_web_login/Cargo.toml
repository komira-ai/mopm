[package]
name = "fn_web_login"
description = "The website's sign-in function: GET /api/v2/auth/web/start and /callback, GitHub's OAuth web flow with S256 PKCE (see README.md)."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
# The executable of the deployment package: lambda_zip stores it as `bootstrap`.
name = "web_login"
path = "src/main.rs"

[dependencies]
mopm_aws.workspace = true
mopm_core.workspace = true
mopm_ports.workspace = true
mopm_web.workspace = true
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-secretsmanager.workspace = true
aws_lambda_events.workspace = true
base64.workspace = true
form_urlencoded.workspace = true
getrandom.workspace = true
hex.workspace = true
jiff.workspace = true
lambda_runtime.workspace = true
serde.workspace = true
serde_dynamo.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
mopm_testing.workspace = true
rustls.workspace = true
