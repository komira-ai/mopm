[package]
name = "mopm_canary"
description = "A Lambda function built from the pinned crates, to hold the build foundation of the registry's Rust functions."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
autobins = false
autotests = false

[[bin]]
name = "canary"
path = "canary/main.rs"

[[test]]
# rustls on aws-lc-rs over buildrules' AWS-LC: handshakes, a refused name, the version.
name = "tls_test"
path = "canary/tls_test.rs"

[[test]]
# The AWS SDK for Rust: one DynamoDB GetItem on loopback, and a client of each service.
name = "sdk_test"
path = "canary/sdk_test.rs"

[dependencies]
aws_lambda_events.workspace = true
lambda_runtime.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
aws-lc-sys.workspace = true
aws-sdk-cloudfront.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-secretsmanager.workspace = true
aws-sdk-sqs.workspace = true
rustls.workspace = true
