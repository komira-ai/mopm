# kpin-update: the weekly update of the pins. It runs `kpin update`, which moves
# each pin that has a `latest_url` to its newest version and fetches the url,
# sha256 and size of what a lock lacks; then `kpin check --previous <the lock of
# the commit it started from>`; and, when a file changed, opens or updates ONE
# pull request from the branch `kpin/weekly`. The same workflow as komira's
# (komira: tools/build/kpin/README.md, "The weekly update"), over this
# repository's locks: tools/node and the four service packages.
#
# Cargo (komira: tools/build/kpin/README.md, "Cargo"): for each line of KPIN_CARGO_SETS the
# job also refreshes Cargo.lock (`cargo update`, unless the manual run says not to), makes
# `cargo metadata --locked --filter-platform <target>` and trims it (`kpin cargo --trim`),
# fetches the size of each linked `.crate` (`kpin update`, verified against Cargo.lock's
# sha256) and regenerates the crates file (`kpin cargo`, with `--previous-lock`: a Cargo.lock
# checksum that changed for a version already locked is an ALARM like any other). Resolution
# happens HERE, on the runner, with the runner's cargo: never in a build action, never on
# the farm. The overrides are read, never written: a person re-derives them.
#
# Exit code 3 of kpin is an ALARM (a changed hash for a version already pinned):
# the job fails, with an error annotation, and no branch is pushed and no pull
# request opened or touched. Exit 1 (for one, a registry that answers TLS 1.2:
# kpin speaks TLS 1.3 only) fails the job the same way.
#
# It needs no farm and no secret. kpin comes from komira, the git external cell
# pinned in .buckconfig (`commit_hash`): a GitHub-hosted runner builds it with
# the pinned buck2 (./buck2: sha256-checked) and komira's pinned zig, on the
# runner itself (no [buck2_re_client] is configured here, so buck2 runs the
# actions locally); kpin's unit tests are welded into its build and run first.
# `update` is the one step that opens a socket.
#
# The token is the default GITHUB_TOKEN with `contents: write` (the branch) and
# `pull-requests: write` (the pull request); there is no other credential.
# .github/scripts/workflow_lint.rb and hygiene.rb allow those two grants for
# this file only, and hold it to schedule + workflow_dispatch triggers.
# TWO SETTINGS this relies on, which a workflow cannot make:
#   * Settings > Actions > General > "Allow GitHub Actions to create and approve
#     pull requests" is on; otherwise opening the pull request fails (the branch
#     is pushed, and the job fails with the compare URL; the older pull requests are
#     left open).
#   * A pull request opened with GITHUB_TOKEN does NOT start other workflows
#     (GitHub's rule against recursive runs), so the checks do not run on it by
#     themselves. A maintainer starts them by pushing an empty commit to
#     its branch or by closing and reopening the pull request.
# The branches `kpin/weekly-<run id>` are this workflow's own: each run pushes a
# new one with a plain push, opens a pull request from it, then closes every
# other open pull request whose head starts with `kpin/weekly-` (a comment links
# the new one) and deletes that pull request's branch through the API with the
# same token. Nothing is ever force-pushed and no history is rewritten. Needs
# `contents: write` (push, delete a branch) and `pull-requests: write`.
#
# Every `uses:` is pinned to a full commit SHA, no step interpolates an
# expression into a script (event data and inputs reach it through env:), and
# the pull request step runs nothing from the pull request: it runs on the
# default branch's commit only.
name: kpin-update

on:
  workflow_dispatch:
    inputs:
      verify:
        description: "Also re-fetch every pinned file and alarm on a republished one (kpin update --verify)."
        type: boolean
        default: false
      cargo_update:
        description: "Refresh Cargo.lock (cargo update) before regenerating the Cargo inputs. Off: regenerate them from the Cargo.lock as committed."
        type: boolean
        default: true
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  # Two runs never overlap; a run in progress is left to finish.
  group: kpin-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    env:
      # One line per lock: <pins.toml> <pins.lock.bzl> [<package-lock.json>...].
      # The step below refuses a pins.lock.bzl in the tree that is not listed,
      # so a new lock cannot go without its weekly update.
      KPIN_SETS: |
        tools/node/pins.toml tools/node/pins.lock.bzl
        service/pins.toml service/api/pins.lock.bzl service/api/package-lock.json
        service/pins.toml service/infra/access/pins.lock.bzl service/infra/access/package-lock.json
        service/pins.toml service/infra/dns/pins.lock.bzl service/infra/dns/package-lock.json
        service/pins.toml service/infra/stacks/pins.lock.bzl service/infra/stacks/package-lock.json
      # One line per Cargo workspace: <workspace dir> <Cargo.lock> <trimmed metadata>
      # <sizes> <overrides> <generated crates file> <target triple>.
      KPIN_CARGO_SETS: |
        third_party/rust third_party/rust/Cargo.lock third_party/rust/cargo/metadata.json third_party/rust/cargo/sizes.txt third_party/rust/cargo/overrides.json third_party/rust/crates.bzl x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: every lock has a line in KPIN_SETS
        run: |
          set -eu
          git ls-files '*pins.lock.bzl' | sort > "$RUNNER_TEMP/locks_in_tree"
          printf '%s\n' "$KPIN_SETS" | awk 'NF { print $2 }' | sort > "$RUNNER_TEMP/locks_listed"
          [ -s "$RUNNER_TEMP/locks_listed" ] || { echo "::error::KPIN_SETS names no lock"; exit 1; }
          if ! diff -u "$RUNNER_TEMP/locks_listed" "$RUNNER_TEMP/locks_in_tree"; then
            echo "::error::KPIN_SETS (the list above is - ) and the pins.lock.bzl files in the tree (+) differ: add or remove the line"
            exit 1
          fi
      # kpin, built where it runs, from the komira cell pinned in .buckconfig: the
      # build runs its unit tests first.
      - name: build kpin
        run: |
          set -eu
          out=$(./buck2 build komira//tools/build/kpin:kpin --show-full-output | sed -n 's/^[^ ]* //p' | tail -n 1)
          [ -x "$out" ] || { echo "::error::kpin is not an executable file: '$out'"; exit 1; }
          mkdir -p "$RUNNER_TEMP/kpin"
          cp "$out" "$RUNNER_TEMP/kpin/kpin"
      - name: kpin update, then kpin check --previous the base lock
        id: kpin
        env:
          VERIFY: ${{ inputs.verify }}
          CARGO_UPDATE: ${{ inputs.cargo_update }}
        run: |
          set -eu -o pipefail
          kpin="$RUNNER_TEMP/kpin/kpin"
          base="$RUNNER_TEMP/base"
          mkdir -p "$base"
          alarm=0
          failed=0
          # run <kpin arguments>: records an alarm (exit 3) or another failure
          # and returns non-zero for either; it never stops the others.
          run() {
            rc=0
            "$kpin" "$@" || rc=$?
            case "$rc" in
              0) return 0 ;;
              3) echo "::error title=kpin alarm::kpin $1 exited 3: a hash changed for a version already pinned. No pull request is opened. Read the output above, and komira's tools/build/kpin/README.md, 'The alarm'."; alarm=1 ;;
              *) echo "::error title=kpin failed::kpin $1 exited $rc"; failed=1 ;;
            esac
            return 1
          }
          n=0
          touched=""
          while read -r pins lock npm; do
            [ -n "$pins" ] || continue
            n=$((n + 1))
            args=(--pins "$pins" --lock "$lock")
            for f in $npm; do args+=(--npm "$f"); done
            cp "$lock" "$base/$n.lock"
            update=(update "${args[@]}")
            if [ "$VERIFY" = "true" ]; then update+=(--verify); fi
            echo "::group::$lock"
            if run "${update[@]}"; then
              run check "${args[@]}" --previous "$base/$n.lock" || true
            fi
            echo "::endgroup::"
            touched="$touched $pins $lock"
          done <<< "$KPIN_SETS"
          # Cargo: resolution on this runner, then kpin reads. The compiler the overrides
          # must be derived for is the one komira pins, in the komira commit .buckconfig names.
          komira=$(sed -n 's/^  commit_hash = \([0-9a-f]\{40\}\)$/\1/p' .buckconfig)
          [ -n "$komira" ] || { echo "::error::cannot read the komira commit from .buckconfig"; exit 1; }
          rustc=$(curl -fsSL "https://raw.githubusercontent.com/komira-ai/komira/$komira/tools/build/toolchains/rust/BUCK" | sed -n 's/^    version = "\([0-9][0-9.]*\)",$/\1/p')
          case "$rustc" in
            ""|*[!0-9.]*) echo "::error::cannot read the pinned rustc version from komira's tools/build/toolchains/rust/BUCK"; exit 1 ;;
          esac
          while read -r dir clock cmeta csizes covs cout ctarget; do
            [ -n "$dir" ] || continue
            n=$((n + 1))
            echo "::group::cargo $clock"
            cp "$clock" "$base/$n.cargo.lock"
            raw="$RUNNER_TEMP/raw.$n.json"
            ok=1
            if [ "$CARGO_UPDATE" != "false" ]; then
              # Honour the manifest's rust-version when picking versions.
              (cd "$dir" && CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo update) || { echo "::error title=cargo update failed::in $dir"; failed=1; ok=0; }
            fi
            if [ "$ok" = 1 ]; then
              (cd "$dir" && cargo metadata --format-version 1 --locked --filter-platform "$ctarget") > "$raw" || { echo "::error title=cargo metadata failed::in $dir"; failed=1; ok=0; }
            fi
            if [ "$ok" = 1 ] && run cargo --metadata "$raw" --target "$ctarget" --trim "$cmeta"; then
              cupdate=(update --no-pins --cargo-lock "$clock" --metadata "$cmeta" --sizes "$csizes" --target "$ctarget")
              if [ "$VERIFY" = "true" ]; then cupdate+=(--verify); fi
              if run "${cupdate[@]}"; then
                run cargo --cargo-lock "$clock" --previous-lock "$base/$n.cargo.lock" --metadata "$cmeta" --overrides "$covs" \
                  --sizes "$csizes" --rustc "$rustc" --target "$ctarget" --cargo-out "$cout" || true
              fi
            fi
            echo "::endgroup::"
            touched="$touched $clock $cmeta $csizes $cout"
          done <<< "$KPIN_CARGO_SETS"
          [ "$alarm" = 0 ] || exit 3
          [ "$failed" = 0 ] || exit 1
          if [ -z "$(git status --porcelain --untracked-files=no)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No pin moved and no hash was added: nothing to open." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "files=${touched# }" >> "$GITHUB_OUTPUT"
            git status --short --untracked-files=no
          fi
      - name: open the pull request from kpin/weekly-<run id>, close the older ones
        # Only for a run of the default branch: a run of another ref (a manual
        # run to try a change) checks everything above and stops here.
        if: steps.kpin.outputs.changed == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ steps.kpin.outputs.files }}
          BASE: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          branch="kpin/weekly-$RUN_ID"
          # shellcheck disable=SC2086 # FILES is a list of repository paths without spaces
          set -- $FILES
          # Nothing outside the files kpin owns may have changed.
          for f in "$@"; do git add -- "$f"; done
          if git status --porcelain --untracked-files=no | grep -qv '^[MA] '; then
            echo "::error::files other than kpin's own changed:"; git status --short; exit 1
          fi
          git diff --cached --stat > "$RUNNER_TEMP/stat"
          {
            echo "Weekly kpin update."
            echo
            echo "Run: $RUN_URL"
            echo
            echo "What changed:"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/stat"
          } > "$RUNNER_TEMP/message"
          git -c user.name="github-actions[bot]" -c user.email="noreply@github.com" \
            commit -q -F "$RUNNER_TEMP/message"
          gh auth setup-git
          # A new branch each run: a plain push, never a force-push.
          git push origin "HEAD:refs/heads/$branch"
          {
            echo "The weekly \`kpin update\` (run: $RUN_URL)."
            echo
            echo "What the run proved before this branch was pushed:"
            echo
            echo "- kpin was built from this repository's pinned toolchain and its unit tests passed (they are welded into the build)."
            echo "- \`kpin update\` exited 0 with no alarm: every hash it kept is the one already pinned, and every file it added was fetched over TLS 1.3 and (for npm) matched the lockfile's integrity."
            echo "- \`kpin check --previous\` the lock of the base commit exited 0: no hash of a locked version changed."
            echo
            echo "Changed files:"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/stat"
            echo
            echo "**Known gap.** This pull request was opened with the workflow's GITHUB_TOKEN, and GitHub does not start other workflows for an event that token causes: \`pr / check\` has not run. Start it by pushing an empty commit to \`$branch\` or by closing and reopening this pull request, and merge only when it is green. The next weekly run closes this pull request and deletes its branch when it opens its own."
          } > "$RUNNER_TEMP/body"
          if ! url=$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base "$BASE" \
            --title "kpin: weekly update of the pins" --body-file "$RUNNER_TEMP/body"); then
            echo "::error title=no pull request::the branch $branch is pushed but the pull request could not be opened (is 'Allow GitHub Actions to create and approve pull requests' on? see the header of this workflow). Open it by hand: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BASE...$branch?expand=1"
            exit 1
          fi
          echo "Opened $url" | tee -a "$GITHUB_STEP_SUMMARY"
          # Only now, with the new pull request open: close the older weekly ones.
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("kpin/weekly-")) | "\(.number) \(.headRefName)"' > "$RUNNER_TEMP/older"
          while read -r num old; do
            [ -n "$num" ] || continue
            [ "$old" != "$branch" ] || continue
            gh pr close "$num" --repo "$GITHUB_REPOSITORY" --comment "Superseded by $url (run $RUN_URL)."
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$old" > /dev/null
            echo "Closed #$num and deleted $old" | tee -a "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/older"
      - name: Stop buck2
        if: always()
        run: ./buck2 kill || true

  # The Mojo toolchain closure (toolchain/README.md, src/core/closure.zig): `mopm sync`
  # installs the Mojo toolchain from a pre-resolved list, not with a solver. This job is the
  # one place a solver runs: pixi, on this runner, solves `mojo` for each version in
  # toolchain/versions.txt on every platform, and `mopm-closure` (built here with zig)
  # turns the lock into the closure files that are committed. A file the closure already pins
  # that comes back with other bytes is an ALARM (exit 3, nothing is written, no pull request).
  # The pull request comes from toolchain/weekly-<run id>, by the same rules as the one above.
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Install pixi (sha256-pinned), the solver
        run: echo "$(tools/install_pixi.sh "$RUNNER_TEMP/pixi")" >> "$GITHUB_PATH"
      - name: Build mopm-closure (its unit tests run first)
        run: |
          set -eu
          zig build test
          zig build
      - name: Solve each version in toolchain/versions.txt, then make the closure files
        id: solve
        run: |
          set -eu
          while read -r ver; do
            case "$ver" in
              ""|"#"*) continue ;;
            esac
            dir="$RUNNER_TEMP/solve-$ver"
            mkdir -p "$dir"
            {
              echo '[workspace]'
              echo 'name = "mopm-toolchain"'
              echo 'channels = ["https://conda.modular.com/max", "conda-forge"]'
              echo 'platforms = ["linux-64", "linux-aarch64", "osx-arm64"]'
              echo
              echo '[dependencies]'
              echo "mojo = \"==$ver\""
              echo "mojo-compiler = \"==$ver\""
              echo 'python = "3.12.*"'
            } > "$dir/pixi.toml"
            pixi lock --manifest-path "$dir/pixi.toml"
            cp "$dir/pixi.lock" "toolchain/mojo-$ver.pixi.lock"
            rc=0
            ./zig-out/bin/mopm-closure "toolchain/mojo-$ver.pixi.lock" src/core/toolchain || rc=$?
            case "$rc" in
              0) ;;
              3) echo "::error title=closure alarm::a file pinned for mojo $ver came back with other bytes (see above). No pull request is opened."; exit 3 ;;
              *) echo "::error title=mopm-closure failed::exit $rc for mojo $ver"; exit 1 ;;
            esac
          done < toolchain/versions.txt
          if [ -z "$(git status --porcelain --untracked-files=all -- toolchain src/core/toolchain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The solver's answer is the committed one: nothing to open." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short --untracked-files=all -- toolchain src/core/toolchain
          fi
      - name: Open the pull request from toolchain/weekly-<run id>, close the older ones
        # Only for a run of the default branch, as above.
        if: steps.solve.outputs.changed == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          branch="toolchain/weekly-$RUN_ID"
          git add -A -- toolchain src/core/toolchain
          if git status --porcelain --untracked-files=no | grep -qv '^[MA] '; then
            echo "::error::files other than the toolchain's own changed:"; git status --short; exit 1
          fi
          git diff --cached --stat > "$RUNNER_TEMP/stat"
          {
            echo "Weekly update of the Mojo toolchain closure."
            echo
            echo "Run: $RUN_URL"
            echo
            echo "What changed:"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/stat"
          } > "$RUNNER_TEMP/message"
          git -c user.name="github-actions[bot]" -c user.email="noreply@github.com" \
            commit -q -F "$RUNNER_TEMP/message"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          {
            echo "The weekly solve of the Mojo toolchain (run: $RUN_URL)."
            echo
            echo "What the run proved before this branch was pushed:"
            echo
            echo "- mopm-closure was built from this repository and its unit tests passed (the committed closure files are what it makes from the committed locks)."
            echo "- Every file the closure already pinned still has the same sha256 and size (no alarm): only new builds and new versions moved."
            echo
            echo "Changed files:"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/stat"
            echo
            echo "**Known gap.** Opened with the workflow's GITHUB_TOKEN, so the pull request's checks have not run. Start them by pushing an empty commit to \`$branch\` or by closing and reopening this pull request, and merge only when they are green (the install end-to-end test installs the new closure). The next weekly run closes this pull request and deletes its branch when it opens its own."
          } > "$RUNNER_TEMP/body"
          if ! url=$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base "$BASE" \
            --title "toolchain: weekly solve of the Mojo closure" --body-file "$RUNNER_TEMP/body"); then
            echo "::error title=no pull request::the branch $branch is pushed but the pull request could not be opened. Open it by hand: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BASE...$branch?expand=1"
            exit 1
          fi
          echo "Opened $url" | tee -a "$GITHUB_STEP_SUMMARY"
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("toolchain/weekly-")) | "\(.number) \(.headRefName)"' > "$RUNNER_TEMP/older"
          while read -r num old; do
            [ -n "$num" ] || continue
            [ "$old" != "$branch" ] || continue
            gh pr close "$num" --repo "$GITHUB_REPOSITORY" --comment "Superseded by $url (run $RUN_URL)."
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$old" > /dev/null
            echo "Closed #$num and deleted $old" | tee -a "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/older"
