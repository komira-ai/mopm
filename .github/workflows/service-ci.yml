name: service-ci

# Tests for the service stacks, the registry API package and the access stack. Runs for pull requests, for merge groups
# of the merge queue and for pushes to main with a read-only token and no id-token: it never holds AWS credentials.
# There is deliberately no path filter, so these checks always report and can be required.

on:
  pull_request:
  # The merge queue's check of a merge group, on the group's head commit (tests/drivers/merge_group_lint.zig).
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer push to a pull request or to main cancels the older run of the same ref. A merge group's run is never cancelled:
  # the merge queue reads its result, and a cancelled required check takes the group out of the queue.
  group: service-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  stacks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: service/infra/stacks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      # The same install deploy.yml runs; it fails if package-lock.json is missing or out of step with package.json.
      - name: Install (npm ci, as in deploy.yml)
        run: npm ci --ignore-scripts --no-audit --no-fund
      # The API stack deploys the handler bundle built from service/api (not committed); the tests that synthesize with the
      # real bundle and the synth step below need it, so it is built first.
      - name: Build the API handler bundle (as in deploy.yml)
        working-directory: service/api
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          test -f dist/http/lambda.js
      # The site stack deploys the site build (not committed); its tests and the synth step need it, as deploy.yml does.
      - name: Build the site (as in deploy.yml)
        working-directory: site
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          for f in index.html app.html 404.html; do test -f "dist/$f"; done
          test -d dist/assets
      - run: npm run typecheck
      - run: npm test
      # cdk hands the app the region it resolves itself as CDK_DEFAULT_REGION: AWS_REGION, AWS_DEFAULT_REGION, ~/.aws/config,
      # then the host's instance metadata, which on a hosted runner in AWS is the runner's own region. The region is set
      # here as deploy.yml sets it, and the metadata is off so neither the runner's region nor its account reaches the synth.
      - name: Synth every stage with a dummy account and zone id
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          export CDK_DEFAULT_ACCOUNT="$(printf '1%.0s' $(seq 12))"
          for stage in beta gamma prod; do
            npx cdk synth --quiet -c stage=$stage -c hostedZoneId=Z0DUMMYZONE -c version=ci -c commit=ci --output cdk.out/$stage
          done

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: service/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      # Fails if package-lock.json is missing or out of step with package.json.
      - name: Install (npm ci)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      # Fails if package-lock.json is missing or out of step with package.json.
      - name: Install (npm ci)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      # The tests read the API contract fixtures (tests/contract/api), the published docs (spec/, docs/), README.md and
      # src/cli/main.zig (the home page copy is held to them).
      - run: npm test
      # The build renders the pages from the docs and README, hashes the assets and checks the tree (tools/check-dist.ts).
      - name: Build the site
        run: |
          npm run build
          for f in index.html app.html 404.html docs/index.html docs/why/index.html docs/getting-started/index.html docs/configuration/index.html docs/examples/index.html docs/mopm-toml/index.html docs/mopm-test/index.html docs/publish-workspace/index.html docs/what-mopm-stores/index.html install.sh; do
            test -f "dist/$f" || { echo "dist/$f is missing" >&2; exit 1; }
          done
          ls dist/assets/*/main.js dist/assets/*/site.css

  dns:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: service/infra/dns
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Install (npm ci, strict)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      # The region and the metadata as in the stacks job's synth.
      - name: Synth the zone of every stage and the delegation, with dummy values
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          acct="$(printf '1%.0s' $(seq 12))"
          for stage in beta gamma prod; do
            npx cdk synth --quiet -c stage=$stage -c account="$acct" --output cdk.out/$stage
          done
          npx cdk synth --quiet -c stage=prod -c account="$acct" -c delegate=true -c hostedZoneId=Z0DUMMYZONE \
            -c betaNameServers=ns-11.awsdns-01.org,ns-12.awsdns-02.com,ns-13.awsdns-03.net,ns-14.awsdns-04.co.uk \
            -c gammaNameServers=ns-21.awsdns-01.org,ns-22.awsdns-02.com,ns-23.awsdns-03.net,ns-24.awsdns-04.co.uk \
            --output cdk.out/delegation

  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: service/infra/access
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      # The same install deploy.yml runs; it fails if package-lock.json is missing or out of step with package.json.
      - name: Install (npm ci, as in deploy.yml)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx jest --ci
