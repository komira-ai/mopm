name: service-ci

# Tests for the service stacks, the registry API package and the access stack. Runs for pull requests and for
# pushes to main with a read-only token and no id-token: it never holds AWS credentials.
# There is deliberately no path filter, so these checks always report and can be required.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stacks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: service/infra/stacks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      # The same install deploy.yml runs; it fails if package-lock.json is missing or out of step with package.json.
      - name: Install (npm ci, as in deploy.yml)
        run: npm ci --ignore-scripts --no-audit --no-fund
      # The API stack deploys the handler bundle built from service/api (not committed); the tests that synthesize with the
      # real bundle (empty-channel) and the synth step below need it, so it is built first.
      - name: Build the API handler bundle (as in deploy.yml)
        working-directory: service/api
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          test -f dist/http/lambda.js
      - run: npm run typecheck
      - run: npm test
      - name: Synth every stage with a dummy account and zone id
        env:
          CDK_DEFAULT_REGION: us-east-1
        run: |
          export CDK_DEFAULT_ACCOUNT="$(printf '1%.0s' $(seq 12))"
          for stage in beta gamma prod; do
            npx cdk synth --quiet -c stage=$stage -c hostedZoneId=Z0DUMMYZONE -c version=ci -c commit=ci --output cdk.out/$stage
          done

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: service/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      # Fails if package-lock.json is missing or out of step with package.json.
      - name: Install (npm ci)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      # Fails if package-lock.json is missing or out of step with package.json.
      - name: Install (npm ci)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      # The tests read the API contract fixtures (tests/contract/api) and the published docs (spec/, docs/).
      - run: npm test

  dns:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: service/infra/dns
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: bash -n
        run: bash -n dns.sh
      - name: dns.sh is a dry run by default and validates its flags
        run: |
          acct="$(printf '4%.0s' $(seq 12))"
          out="$(./dns.sh --stage beta --account "$acct" --profile p)"
          echo "$out" | grep -q '^DRY-RUN: npx cdk deploy mopm-dns-beta-zone'
          if echo "$out" | grep -q '^+ '; then echo "dry run executed something" >&2; exit 1; fi
          if ./dns.sh --stage dev --account "$acct" --profile p; then exit 1; fi
          if ./dns.sh --stage beta --account 123 --profile p; then exit 1; fi
          if ./dns.sh --stage beta --delegate --account "$acct" --profile p; then exit 1; fi
          if ./dns.sh --stage prod --delegate --account "$acct" --profile p --beta-ns a,b,c,d --gamma-ns a,b,c,d; then exit 1; fi
      - name: Install (npm ci, strict)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Synth the zone of every stage and the delegation, with dummy values
        run: |
          export CDK_DEFAULT_REGION=us-east-1
          acct="$(printf '1%.0s' $(seq 12))"
          for stage in beta gamma prod; do
            npx cdk synth --quiet -c stage=$stage -c account="$acct" --output cdk.out/$stage
          done
          npx cdk synth --quiet -c stage=prod -c account="$acct" -c delegate=true -c hostedZoneId=Z0DUMMYZONE \
            -c betaNameServers=ns-11.awsdns-01.org,ns-12.awsdns-02.com,ns-13.awsdns-03.net,ns-14.awsdns-04.co.uk \
            -c gammaNameServers=ns-21.awsdns-01.org,ns-22.awsdns-02.com,ns-23.awsdns-03.net,ns-24.awsdns-04.co.uk \
            --output cdk.out/delegation

  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: service/infra/access
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: bash -n
        run: bash -n bootstrap.sh
      - name: bootstrap.sh --update-policy and --policy-only against a fake aws (no AWS access)
        run: ./test/bootstrap-update-policy.sh
      - name: bootstrap.sh is a dry run by default and validates its flags
        run: |
          acct="$(printf '4%.0s' $(seq 12))"
          out="$(./bootstrap.sh --stage beta --account "$acct" --region us-west-2 --profile p)"
          echo "$out" | grep -q '^DRY-RUN: aws iam create-policy'
          if echo "$out" | grep -q '^+ '; then echo "dry run executed something" >&2; exit 1; fi
          if ./bootstrap.sh --stage dev --account "$acct" --region r --profile p; then exit 1; fi
          if ./bootstrap.sh --stage beta --account 123 --region r --profile p; then exit 1; fi
          if ./bootstrap.sh --stage beta --account "$acct" --region r --profile p --repo other/repo; then exit 1; fi
      - name: bootstrap.sh passes the context to cdk and gates --approve-iam
        run: |
          acct="$(printf '5%.0s' $(seq 12))"
          out="$(./bootstrap.sh --stage beta --account "$acct" --region us-east-1 --profile p)"
          boot="$(echo "$out" | grep '^DRY-RUN: npx cdk bootstrap')"
          for v in stage=beta "account=$acct" region=us-east-1; do
            echo "$boot" | grep -q -- "-c $v" || { echo "bootstrap lacks -c $v" >&2; exit 1; }
          done
          echo "$out" | grep -q '^DRY-RUN: npx cdk diff' || { echo "no cdk diff" >&2; exit 1; }
          echo "$out" | grep -q 'require-approval broadening' || { echo "default is not broadening" >&2; exit 1; }
          if echo "$out" | grep -q -- '--approve-iam\|require-approval never'; then echo "approval flag present without --approve-iam" >&2; exit 1; fi
          out2="$(./bootstrap.sh --stage beta --account "$acct" --region us-east-1 --profile p --approve-iam)"
          echo "$out2" | grep -q 'require-approval never' || { echo "--approve-iam ignored" >&2; exit 1; }
      # The same install deploy.yml runs; it fails if package-lock.json is missing or out of step with package.json.
      - name: Install (npm ci, as in deploy.yml)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx jest --ci
