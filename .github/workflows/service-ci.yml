name: service-ci

# Tests for the service stacks and the access stack. Runs for pull requests and for
# pushes to main with a read-only token and no id-token: it never holds AWS credentials.
# There is deliberately no path filter, so these checks always report and can be required.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stacks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: service/infra/stacks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install (lockfile if present)
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-audit --no-fund
          else npm install --ignore-scripts --no-audit --no-fund; fi
      - run: npm run typecheck
      - run: npm test
      - name: Synth every stage with a dummy account and zone id
        env:
          CDK_DEFAULT_REGION: us-east-1
        run: |
          export CDK_DEFAULT_ACCOUNT="$(printf '1%.0s' $(seq 12))"
          for stage in beta gamma prod; do
            npx cdk synth --quiet -c stage=$stage -c hostedZoneId=Z0DUMMYZONE -c version=ci -c commit=ci --output cdk.out/$stage
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stacks-package-lock
          path: service/infra/stacks/package-lock.json
          retention-days: 3
          if-no-files-found: ignore

  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: service/infra/access
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: bash -n
        run: bash -n bootstrap.sh
      - name: bootstrap.sh is a dry run by default and validates its flags
        run: |
          acct="$(printf '4%.0s' $(seq 12))"
          out="$(./bootstrap.sh --stage beta --account "$acct" --region us-west-2 --profile p)"
          echo "$out" | grep -q '^DRY-RUN: aws iam create-policy'
          if echo "$out" | grep -q '^+ '; then echo "dry run executed something" >&2; exit 1; fi
          if ./bootstrap.sh --stage dev --account "$acct" --region r --profile p; then exit 1; fi
          if ./bootstrap.sh --stage beta --account 123 --region r --profile p; then exit 1; fi
          if ./bootstrap.sh --stage beta --account "$acct" --region r --profile p --repo other/repo; then exit 1; fi
      - name: Install (lockfile if present)
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-audit --no-fund
          else npm install --ignore-scripts --no-audit --no-fund; fi
      - run: npx tsc --noEmit
      - run: npx jest --ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: access-package-lock
          path: service/infra/access/package-lock.json
          retention-days: 3
          if-no-files-found: ignore
