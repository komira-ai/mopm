# macOS runs, Linux always runs. The GitHub macOS queue waits 50 to 120 minutes, so the macos-14 leg of every
# matrix below is not part of a pull request's checks. It runs on a push to main (after the merge, so a Mac
# regression is still caught and the main-red policy applies), on the nightly schedule, on workflow_dispatch, and on
# a pull request only while it carries the label `macos` (adding the label starts the run). The Linux legs are
# the same everywhere. release.yml and release-check.yml keep their macOS packaging: they build the Mac binaries.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  # release.yml runs this whole workflow again on the pushed commit as its `beta` stage (a red job stops the release).
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos')) && '["ubuntu-24.04","ubuntu-24.04-arm","macos-14"]' || '["ubuntu-24.04","ubuntu-24.04-arm"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Unit and golden tests
        run: zig build test
      - name: Build the CLI
        run: zig build

  # The contract checks (the OpenAPI document, the schemas, the API cases, the examples, and the replay of the cases
  # against the fake registry) and the lock goldens are the Buck2 targets //:contract, //:contract_replay and
  # //:lock_golden, built by farm.yml (`./buck2 build //...`). No Python is left in them, so no job runs here.

  mojo-e2e:
    name: mojo e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos')) && '["ubuntu-24.04","ubuntu-24.04-arm","macos-14"]' || '["ubuntu-24.04","ubuntu-24.04-arm"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Install pixi 0.79.0 (sha256-pinned)
        run: echo "$(tools/install_pixi.sh "$RUNNER_TEMP/pixi")" >> "$GITHUB_PATH"
      - name: Create the Mojo environment (mojo 1.0.0, tests/e2e/pixi.toml)
        run: |
          mkdir -p "$RUNNER_TEMP/mojo-env"
          cp tests/e2e/pixi.toml "$RUNNER_TEMP/mojo-env/pixi.toml"
          pixi install --manifest-path "$RUNNER_TEMP/mojo-env/pixi.toml"
      # The Zig drivers of tests/drivers, run natively by build.zig (the farm runs the same
      # files as //:autolink, //:discovery, //:supervisor and //:flaky on Linux x86_64 only).
      # The REPL checks of the autolink driver run where the environment has bin/mojo-lldb.
      - name: mopm build, run and repl against the real mojo (autolink)
        run: zig build test-autolink -Dmojo-env="$RUNNER_TEMP/mojo-env/.pixi/envs/default"
      - name: mopm test --list against the real mojo (discovery)
        if: ${{ !cancelled() }}
        run: zig build test-discovery -Dmojo-env="$RUNNER_TEMP/mojo-env/.pixi/envs/default"
      - name: mopm test verdicts, JSON, JUnit and the group kill (supervisor)
        if: ${{ !cancelled() }}
        run: zig build test-supervisor -Dmojo-env="$RUNNER_TEMP/mojo-env/.pixi/envs/default"
      - name: mopm test --retries, --deny-flaky and filters on deterministic flaky fixtures (flaky)
        if: ${{ !cancelled() }}
        run: zig build test-flaky -Dmojo-env="$RUNNER_TEMP/mojo-env/.pixi/envs/default"

  registry-e2e:
    name: registry e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos')) && '["ubuntu-24.04","ubuntu-24.04-arm","macos-14"]' || '["ubuntu-24.04","ubuntu-24.04-arm"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Build the CLI and the fake registry
        run: zig build
      # mopm login/logout/whoami and pack/publish against the fake registry, and mopm sync against it, are Zig tests
      # (//:registry_login, //:registry_publish, //:install_e2e) that farm.yml builds; the Python scripts are gone.

  # The packer against the registry's own validator (service/api/src/validate): what mopm pack writes must be accepted,
  # and each planted defect must be refused with its rule.
  pack-conformance:
    name: pack conformance (validator)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Build the CLI
        run: zig build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Build the validator (service/api, as service-ci.yml installs it)
        working-directory: service/api
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:validate-lib
      - name: mopm pack, then the validator on the result
        run: node tests/pack_conformance/check.mjs ./zig-out/bin/mopm service/api/dist-validate
