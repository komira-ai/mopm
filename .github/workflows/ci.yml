name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Unit and golden tests
        run: zig build test
      - name: Build the CLI
        run: zig build
      - name: Link-plan golden files
        run: tests/run_golden.sh ./zig-out/bin/mopm

  contract:
    name: contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the validators (pip, in a throwaway environment)
        run: |
          python3 -m venv "$RUNNER_TEMP/contract-venv"
          "$RUNNER_TEMP/contract-venv/bin/pip" install --disable-pip-version-check -r tests/contract/requirements.txt
      - name: Validate the OpenAPI document, the schemas and the examples
        run: '"$RUNNER_TEMP/contract-venv/bin/python" -I tests/contract/validate.py'
      - name: The locks mopm's unit tests write pass the lock schema and rules; broken copies are refused
        run: '"$RUNNER_TEMP/contract-venv/bin/python" -I tests/resolve/check_golden.py'
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Build the fake registry
        run: zig build
      - name: Replay the API cases against the fake registry
        run: '"$RUNNER_TEMP/contract-venv/bin/python" -I tests/contract/replay.py ./zig-out/bin/mopm-fake-registry'

  autolink:
    name: autolink e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Build the CLI
        run: zig build
      - name: Install pixi 0.79.0 (sha256-pinned)
        run: echo "$(tools/install_pixi.sh "$RUNNER_TEMP/pixi")" >> "$GITHUB_PATH"
      - name: Create the Mojo environment (mojo 1.0.0, tests/e2e/pixi.toml)
        run: |
          mkdir -p "$RUNNER_TEMP/mojo-env"
          cp tests/e2e/pixi.toml "$RUNNER_TEMP/mojo-env/pixi.toml"
          pixi install --manifest-path "$RUNNER_TEMP/mojo-env/pixi.toml"
      - name: mopm build, run and repl against the real mojo
        run: tests/e2e/run.sh ./zig-out/bin/mopm "$RUNNER_TEMP/mojo-env/.pixi/envs/default" "$RUNNER_TEMP/e2e"

  test-discovery:
    name: test discovery e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Build the CLI
        run: zig build
      - name: Install pixi 0.79.0 (sha256-pinned)
        run: echo "$(tools/install_pixi.sh "$RUNNER_TEMP/pixi")" >> "$GITHUB_PATH"
      - name: Create the Mojo environment (mojo 1.0.0, tests/e2e/pixi.toml)
        run: |
          mkdir -p "$RUNNER_TEMP/mojo-env"
          cp tests/e2e/pixi.toml "$RUNNER_TEMP/mojo-env/pixi.toml"
          pixi install --manifest-path "$RUNNER_TEMP/mojo-env/pixi.toml"
      - name: mopm test --list, and --check against harnesses built by the real mojo
        run: tests/e2e/test_discovery.sh ./zig-out/bin/mopm "$RUNNER_TEMP/mojo-env/.pixi/envs/default" "$RUNNER_TEMP/test-discovery"

  test-supervisor:
    name: test supervisor e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Build the CLI
        run: zig build
      - name: Install pixi 0.79.0 (sha256-pinned)
        run: echo "$(tools/install_pixi.sh "$RUNNER_TEMP/pixi")" >> "$GITHUB_PATH"
      - name: Create the Mojo environment (mojo 1.0.0, tests/e2e/pixi.toml)
        run: |
          mkdir -p "$RUNNER_TEMP/mojo-env"
          cp tests/e2e/pixi.toml "$RUNNER_TEMP/mojo-env/pixi.toml"
          pixi install --manifest-path "$RUNNER_TEMP/mojo-env/pixi.toml"
      - name: mopm test runs the fixtures; exact verdicts, JSON, JUnit, supervisor self-test
        run: tests/e2e/test_supervisor.sh ./zig-out/bin/mopm "$RUNNER_TEMP/mojo-env/.pixi/envs/default" "$RUNNER_TEMP/test-supervisor"
      - name: mopm test --retries, --deny-flaky and filters on deterministic flaky fixtures
        if: ${{ !cancelled() }}
        run: tests/e2e/test_flaky.sh ./zig-out/bin/mopm "$RUNNER_TEMP/mojo-env/.pixi/envs/default" "$RUNNER_TEMP/test-flaky"

  registry-e2e:
    name: registry e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Build the CLI and the fake registry
        run: zig build
      - name: mopm login, logout and whoami against the fake registry
        run: python3 -I tests/registry_e2e/run.py ./zig-out/bin/mopm ./zig-out/bin/mopm-fake-registry
      - name: mopm lock, update and tree against the fake registry (wrong-version traps, refusals)
        run: python3 -I tests/resolve_e2e/run.py ./zig-out/bin/mopm ./zig-out/bin/mopm-fake-registry

  install-e2e:
    name: install e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Build the CLI and the fake registry
        run: zig build
      - name: Install pixi 0.79.0 (sha256-pinned)
        run: echo "$(tools/install_pixi.sh "$RUNNER_TEMP/pixi")" >> "$GITHUB_PATH"
      - name: Create the Mojo environment that precompiles the fixture package (mojo 1.0.0, tests/e2e/pixi.toml)
        run: |
          mkdir -p "$RUNNER_TEMP/mojo-env"
          cp tests/e2e/pixi.toml "$RUNNER_TEMP/mojo-env/pixi.toml"
          pixi install --manifest-path "$RUNNER_TEMP/mojo-env/pixi.toml"
      - name: mopm sync installs a package with a native library from the fake registry, build and run use it; a tampered file and a stale lock are refused
        run: python3 -I tests/install_e2e/run.py ./zig-out/bin/mopm ./zig-out/bin/mopm-fake-registry "$RUNNER_TEMP/mojo-env/.pixi/envs/default"
