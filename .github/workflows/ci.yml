# Tiers (the pull request runs the unit tier only; the rest runs after the merge):
#   unit   each library: `test` (zig build test) and `registry-build` (the CLI and the fake registry build). These run on
#          every pull request, and on a push to main, nightly and by hand. No coverage is measured by any job of this
#          repository today, so none is reported.
#   beta   each component against its real counterpart: `mojo-e2e` (the CLI against the real Mojo), `pack-conformance` (the
#          packer against the registry's validator) and `installer` (site/static/install.sh against a fake release). They have
#          `if: github.event_name != 'pull_request'`: never on a pull request. release.yml runs this whole workflow on the
#          pushed commit as its `beta` stage, and a push to main runs it too.
#   gamma  the whole system with real consumers: promote.yml (deploy.yml, e2e.yml), not this file.
# tests/drivers/hygiene.zig holds this split (the jobs that may run on a pull request, and which workflows may).
#
# macOS runs, Linux always runs. The GitHub macOS queue waits 50 to 120 minutes, so the macos-14 leg of the unit matrix
# is not part of a pull request's checks. It runs on a push to main (after the merge, so a Mac
# regression is still caught and the main-red policy applies), on the nightly schedule, on workflow_dispatch, and on
# a pull request only while it carries the label `macos` (adding the label starts the run). The Linux legs are
# the same everywhere. release.yml keeps its macOS packaging: it builds the Mac binaries.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  # release.yml runs this whole workflow again on the pushed commit as its `beta` stage (a red job stops the release).
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos')) && '["ubuntu-24.04","ubuntu-24.04-arm","macos-14"]' || '["ubuntu-24.04","ubuntu-24.04-arm"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Unit and golden tests
        run: zig build test
      - name: Build the CLI
        run: zig build

  # The contract checks (the OpenAPI document, the schemas, the API cases, the examples, and the replay of the cases
  # against the fake registry) and the lock goldens are the Buck2 targets //:contract, //:contract_replay and
  # //:lock_golden, built by farm.yml (`./buck2 build //...`). No Python is left in them, so no job runs here.

  mojo-e2e:
    name: mojo e2e (${{ matrix.os }})
    # Beta tier: never on a pull request.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Install pixi 0.79.0 (sha256-pinned)
        run: echo "$(tools/install_pixi.sh "$RUNNER_TEMP/pixi")" >> "$GITHUB_PATH"
      - name: Create the Mojo environment (mojo 1.0.0, tests/e2e/pixi.toml)
        run: |
          mkdir -p "$RUNNER_TEMP/mojo-env"
          cp tests/e2e/pixi.toml "$RUNNER_TEMP/mojo-env/pixi.toml"
          pixi install --manifest-path "$RUNNER_TEMP/mojo-env/pixi.toml"
      # The Zig drivers of tests/drivers, run natively by build.zig (the farm runs the same
      # files as //:autolink, //:discovery, //:supervisor, //:flaky and //:native_workspace_mojo on Linux x86_64 only).
      # The REPL checks of the autolink driver run where the environment has bin/mojo-lldb.
      - name: mopm build, run and repl against the real mojo (autolink)
        run: zig build test-autolink -Dmojo-env="$RUNNER_TEMP/mojo-env/.pixi/envs/default"
      - name: mopm test --list against the real mojo (discovery)
        if: ${{ !cancelled() }}
        run: zig build test-discovery -Dmojo-env="$RUNNER_TEMP/mojo-env/.pixi/envs/default"
      - name: mopm test verdicts, JSON, JUnit and the group kill (supervisor)
        if: ${{ !cancelled() }}
        run: zig build test-supervisor -Dmojo-env="$RUNNER_TEMP/mojo-env/.pixi/envs/default"
      - name: mopm test --retries, --deny-flaky and filters on deterministic flaky fixtures (flaky)
        if: ${{ !cancelled() }}
        run: zig build test-flaky -Dmojo-env="$RUNNER_TEMP/mojo-env/.pixi/envs/default"
      # A workspace member that ships its own C library ([native.<id>] with srcs) and a package that links it: mopm lock and
      # plan, the native built from its C sources, mopm unit build, mopm pack, and an --overlay install of the packed set in a
      # fresh project where the program is built and run again (tests/drivers/native_workspace_test.zig; the farm runs the
      # same file as //:native_workspace_mojo on Linux x86_64 and, with a stand-in compiler, as //:native_workspace on every pull request).
      - name: native library from C sources, pack and --overlay install, against the real mojo (native-workspace)
        if: ${{ !cancelled() }}
        run: zig build test-native-workspace -Dmojo-env="$RUNNER_TEMP/mojo-env/.pixi/envs/default"
      # mopm build with no program (the library as a .mojoc, the programs) and a program that imports path dependencies, on
      # all three platforms (tests/drivers/build_targets_test.zig; the farm runs it as //:build_targets_mojo, and with a
      # stand-in compiler as //:build_targets on every pull request).
      - name: mopm build of a package's targets and its path dependencies, against the real mojo (build-targets)
        if: ${{ !cancelled() }}
        run: zig build test-build-targets -Dmojo-env="$RUNNER_TEMP/mojo-env/.pixi/envs/default"

  registry-build:
    name: build cli and fake registry (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos')) && '["ubuntu-24.04","ubuntu-24.04-arm","macos-14"]' || '["ubuntu-24.04","ubuntu-24.04-arm"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Build the CLI and the fake registry
        run: zig build
      # This job only builds. mopm login/logout/whoami and pack/publish against the fake registry, and mopm sync against it, are Zig tests
      # (//:registry_login, //:registry_publish, //:install_e2e) that farm.yml builds; the Python scripts are gone.

  # The packer against the registry's own validator (service/api/src/validate): what mopm pack writes must be accepted,
  # and each known defect must be refused with its rule.
  pack-conformance:
    name: pack conformance (validator)
    # Beta tier: never on a pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Build the CLI
        run: zig build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Build the validator (service/api, as service-ci.yml installs it)
        working-directory: service/api
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:validate-lib
      - name: mopm pack, then the validator on the result
        run: node tests/pack_conformance/check.mjs ./zig-out/bin/mopm service/api/dist-validate

  # install.sh against a fake release served over loopback, then with known defects that it must catch.
  # It needs a shell, curl and a network stack, so only a GitHub-hosted runner runs it (no Buck2 target does).
  installer:
    name: install.sh (${{ matrix.os }})
    # Beta tier: never on a pull request.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: install.sh against a fake release, then with known defects (each must turn a check red)
        run: zig test tests/drivers/install_script_test.zig
