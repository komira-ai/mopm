# macOS runs, Linux always runs. The GitHub macOS queue waits 50 to 120 minutes, so the macos-14 leg of every
# matrix below is not part of a pull request's checks. It runs on a push to main (after the merge, so a Mac
# regression is still caught and the main-red policy applies), on the nightly schedule, on workflow_dispatch, and on
# a pull request only while it carries the label `macos` (adding the label starts the run). The Linux legs are
# the same everywhere. release.yml and release-check.yml keep their macOS packaging: they build the Mac binaries.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos')) && '["ubuntu-24.04","ubuntu-24.04-arm","macos-14"]' || '["ubuntu-24.04","ubuntu-24.04-arm"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Unit and golden tests
        run: zig build test
      - name: Build the CLI
        run: zig build
      - name: Link-plan golden files
        run: tests/run_golden.sh ./zig-out/bin/mopm

  contract:
    name: contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos')) && '["ubuntu-24.04","ubuntu-24.04-arm","macos-14"]' || '["ubuntu-24.04","ubuntu-24.04-arm"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the validators (pip, in a throwaway environment)
        run: |
          python3 -m venv "$RUNNER_TEMP/contract-venv"
          "$RUNNER_TEMP/contract-venv/bin/pip" install --disable-pip-version-check -r tests/contract/requirements.txt
      - name: Validate the OpenAPI document, the schemas and the examples
        run: '"$RUNNER_TEMP/contract-venv/bin/python" -I tests/contract/validate.py'
      - name: The locks mopm's unit tests write pass the lock schema and rules; broken copies are refused
        run: '"$RUNNER_TEMP/contract-venv/bin/python" -I tests/resolve/check_golden.py'
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Build the fake registry
        run: zig build
      - name: Replay the API cases against the fake registry
        run: '"$RUNNER_TEMP/contract-venv/bin/python" -I tests/contract/replay.py ./zig-out/bin/mopm-fake-registry'

  autolink:
    name: autolink e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos')) && '["ubuntu-24.04","ubuntu-24.04-arm","macos-14"]' || '["ubuntu-24.04","ubuntu-24.04-arm"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Build the CLI
        run: zig build
      - name: Install pixi 0.79.0 (sha256-pinned)
        run: echo "$(tools/install_pixi.sh "$RUNNER_TEMP/pixi")" >> "$GITHUB_PATH"
      - name: Create the Mojo environment (mojo 1.0.0, tests/e2e/pixi.toml)
        run: |
          mkdir -p "$RUNNER_TEMP/mojo-env"
          cp tests/e2e/pixi.toml "$RUNNER_TEMP/mojo-env/pixi.toml"
          pixi install --manifest-path "$RUNNER_TEMP/mojo-env/pixi.toml"
      - name: mopm build, run and repl against the real mojo
        run: tests/e2e/run.sh ./zig-out/bin/mopm "$RUNNER_TEMP/mojo-env/.pixi/envs/default" "$RUNNER_TEMP/e2e"

  test-discovery:
    name: test discovery e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos')) && '["ubuntu-24.04","ubuntu-24.04-arm","macos-14"]' || '["ubuntu-24.04","ubuntu-24.04-arm"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Build the CLI
        run: zig build
      - name: Install pixi 0.79.0 (sha256-pinned)
        run: echo "$(tools/install_pixi.sh "$RUNNER_TEMP/pixi")" >> "$GITHUB_PATH"
      - name: Create the Mojo environment (mojo 1.0.0, tests/e2e/pixi.toml)
        run: |
          mkdir -p "$RUNNER_TEMP/mojo-env"
          cp tests/e2e/pixi.toml "$RUNNER_TEMP/mojo-env/pixi.toml"
          pixi install --manifest-path "$RUNNER_TEMP/mojo-env/pixi.toml"
      - name: mopm test --list, and --check against harnesses built by the real mojo
        run: tests/e2e/test_discovery.sh ./zig-out/bin/mopm "$RUNNER_TEMP/mojo-env/.pixi/envs/default" "$RUNNER_TEMP/test-discovery"

  test-supervisor:
    name: test supervisor e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos')) && '["ubuntu-24.04","ubuntu-24.04-arm","macos-14"]' || '["ubuntu-24.04","ubuntu-24.04-arm"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Build the CLI
        run: zig build
      - name: Install pixi 0.79.0 (sha256-pinned)
        run: echo "$(tools/install_pixi.sh "$RUNNER_TEMP/pixi")" >> "$GITHUB_PATH"
      - name: Create the Mojo environment (mojo 1.0.0, tests/e2e/pixi.toml)
        run: |
          mkdir -p "$RUNNER_TEMP/mojo-env"
          cp tests/e2e/pixi.toml "$RUNNER_TEMP/mojo-env/pixi.toml"
          pixi install --manifest-path "$RUNNER_TEMP/mojo-env/pixi.toml"
      - name: mopm test runs the fixtures; exact verdicts, JSON, JUnit, supervisor self-test
        run: tests/e2e/test_supervisor.sh ./zig-out/bin/mopm "$RUNNER_TEMP/mojo-env/.pixi/envs/default" "$RUNNER_TEMP/test-supervisor"
      - name: mopm test --retries, --deny-flaky and filters on deterministic flaky fixtures
        if: ${{ !cancelled() }}
        run: tests/e2e/test_flaky.sh ./zig-out/bin/mopm "$RUNNER_TEMP/mojo-env/.pixi/envs/default" "$RUNNER_TEMP/test-flaky"

  registry-e2e:
    name: registry e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos')) && '["ubuntu-24.04","ubuntu-24.04-arm","macos-14"]' || '["ubuntu-24.04","ubuntu-24.04-arm"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Build the CLI and the fake registry
        run: zig build
      # mopm login/logout/whoami and pack/publish against the fake registry, and mopm sync against it, are Zig tests
      # (//:registry_login, //:registry_publish, //:install_e2e) that farm.yml builds; the Python scripts are gone.

      - name: Install the contract validators (pip, in a throwaway environment)
        run: |
          python3 -m venv "$RUNNER_TEMP/contract-venv"
          "$RUNNER_TEMP/contract-venv/bin/pip" install --disable-pip-version-check -r tests/contract/requirements.txt
      - name: mopm lock, update and tree against the fake registry (wrong-version traps, refusals, lock schema)
        run: '"$RUNNER_TEMP/contract-venv/bin/python" -I tests/resolve_e2e/run.py ./zig-out/bin/mopm ./zig-out/bin/mopm-fake-registry'

  # The packer against the registry's own validator (service/api/src/validate): what mopm pack writes must be accepted,
  # and each planted defect must be refused with its rule.
  pack-conformance:
    name: pack conformance (validator)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Build the CLI
        run: zig build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Build the validator (service/api, as service-ci.yml installs it)
        working-directory: service/api
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:validate-lib
      - name: mopm pack, then the validator on the result
        run: node tests/pack_conformance/check.mjs ./zig-out/bin/mopm service/api/dist-validate
