name: spike-native-ux

# SPIKE, not for merge, never on a pull request: what a user gets on each hosted runner
# (mopm release asset, mopm add of the beta native packages, bare-name dlopen of liblz4
# from a pixi env, mojo repl). Every step records its outcome and never fails the leg, so
# one run reports all three platforms. Read-only: GETs of the beta registry, no secret.

# workflow_dispatch needs the file on the default branch, which this spike must never touch,
# so the spike branch's own push starts the single run.
on:
  workflow_dispatch:
  push:
    branches: [spike/native-ux]

permissions:
  contents: read

jobs:
  spike:
    name: spike (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, os: ubuntu-24.04, lib: liblz4.so.1 }
          - { target: linux-aarch64, os: ubuntu-24.04-arm, lib: liblz4.so.1 }
          - { target: macos-arm64, os: macos-14, lib: liblz4.dylib }
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pixi 0.79.0 (sha256-pinned)
        run: echo "$(tools/install_pixi.sh "$RUNNER_TEMP/pixi")" >> "$GITHUB_PATH"

      - name: RESULT mopm release asset
        run: |
          set +e
          tag=$(gh release view -R komira-ai/mopm --json tagName -q .tagName)
          echo "latest tag: $tag"
          ver=${tag#v}
          echo "assets:"; gh release view -R komira-ai/mopm --json assets -q '.assets[].name'
          mkdir -p "$RUNNER_TEMP/dl"
          if gh release download "$tag" -R komira-ai/mopm -p "mopm-$ver-$TARGET.tar.gz" -D "$RUNNER_TEMP/dl"; then
            echo "RESULT asset-exists $TARGET: yes (mopm-$ver-$TARGET.tar.gz)"
            tar -xzf "$RUNNER_TEMP/dl/mopm-$ver-$TARGET.tar.gz" -C "$RUNNER_TEMP/dl"
            ls -R "$RUNNER_TEMP/dl" | head -20
            bin=$(find "$RUNNER_TEMP/dl" -name mopm -type f | head -1)
            echo "MOPM_BIN=$bin" >> "$GITHUB_ENV"
            "$bin" --version
          else
            echo "RESULT asset-exists $TARGET: NO"
          fi

      - name: RESULT mopm new, add beta native packages
        run: |
          set +e
          [ -n "$MOPM_BIN" ] || { echo "RESULT mopm-add: no binary"; exit 0; }
          export MOPM_HOME="$RUNNER_TEMP/mopmhome" HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          cd "$RUNNER_TEMP" && "$MOPM_BIN" new uxe_app --bin; echo "RESULT mopm-new exit=$?"
          cd uxe_app && cat mopm.toml
          for p in komira_lz4 komira_libc; do
            echo "--- mopm add $p --registry beta"
            "$MOPM_BIN" add "$p" --registry beta 2>&1; echo "RESULT mopm-add $p exit=$?"
          done
          echo "--- mopm.lock"; cat mopm.lock 2>&1 | head -80
          echo "--- mopm sync --registry beta"
          "$MOPM_BIN" sync --registry beta 2>&1 | tail -30; echo "RESULT mopm-sync exit=${PIPESTATUS[0]}"

      - name: Create the pixi env (mojo 1.0.0 + conda-forge lz4-c)
        run: |
          set +e
          cd .github/spike-native-ux
          pixi install 2>&1 | tail -15; echo "RESULT pixi-install exit=${PIPESTATUS[0]}"
          ls .pixi/envs/default/lib | grep -i lz4

      - name: RESULT bare-name dlopen of liblz4 (mojo run, then built binary with scrubbed env)
        run: |
          set +e
          cd .github/spike-native-ux
          echo "env DYLD/LD:"; env | grep -E '^(DYLD|LD_LIBRARY)' || echo "(none)"
          echo "--- pixi run mojo run dl.mojo"
          pixi run mojo run dl.mojo 2>&1 | tail -15; echo "RESULT dlopen-mojo-run exit=${PIPESTATUS[0]}"
          echo "--- pixi run mojo build dl.mojo"
          pixi run mojo build dl.mojo -o "$RUNNER_TEMP/dl_bin" 2>&1 | tail -15; echo "RESULT mojo-build exit=${PIPESTATUS[0]}"
          echo "--- built binary, scrubbed env (no rpath given), cwd elsewhere"
          (cd "$RUNNER_TEMP" && env -i HOME="$HOME" PATH=/usr/bin:/bin ./dl_bin 2>&1 | tail -10; echo "RESULT dlopen-built-scrubbed exit=${PIPESTATUS[0]}")
          echo "--- built binary with -Xlinker -rpath <env>/lib"
          pixi run mojo build dl.mojo -Xlinker -rpath -Xlinker "$PWD/.pixi/envs/default/lib" -o "$RUNNER_TEMP/dl_bin_rpath" 2>&1 | tail -10
          (cd "$RUNNER_TEMP" && env -i HOME="$HOME" PATH=/usr/bin:/bin ./dl_bin_rpath 2>&1 | tail -10; echo "RESULT dlopen-built-rpath-scrubbed exit=${PIPESTATUS[0]}")

      - name: RESULT mojo repl via stdin
        run: |
          set +e
          cd .github/spike-native-ux
          ls .pixi/envs/default/bin | grep -iE 'lldb|debugserver|mojo'
          find .pixi/envs/default -name 'debugserver*' | head
          printf 'print(1 + 1)\n\n' > "$RUNNER_TEMP/repl.stdin"
          echo "--- pixi run mojo repl < stdin (stdout+stderr, 60 lines)"
          pixi run mojo repl < "$RUNNER_TEMP/repl.stdin" 2>&1 | head -60; echo "RESULT mojo-repl exit=${PIPESTATUS[0]}"
          if [ "$(uname -s)" = Darwin ]; then
            echo "--- with LLDB_DEBUGSERVER_PATH = Xcode debugserver"
            ds=/Applications/Xcode.app/Contents/SharedFrameworks/LLDB.framework/Resources/debugserver
            ls -l "$ds" /Library/Developer/CommandLineTools/Library/PrivateFrameworks/LLDB.framework/Resources/debugserver 2>&1
            LLDB_DEBUGSERVER_PATH="$ds" pixi run mojo repl < "$RUNNER_TEMP/repl.stdin" 2>&1 | head -40; echo "RESULT mojo-repl-xcode-debugserver exit=${PIPESTATUS[0]}"
          fi
