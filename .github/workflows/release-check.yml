name: release-check

# A pull request that touches the release machinery proves it without publishing: the same build and
# packaging as release.yml (release-build.yml, dry run: no tag), SHA256SUMS written and checked, and
# the installer run against a local fake release on Linux and macOS, with planted defects that it
# must catch. No write permission, nothing uploaded but the short-lived workflow artifacts.

on:
  pull_request:
    paths:
      - ".github/workflows/release*.yml"
      - "tools/release_*.sh"
      - "tools/install_zig.sh"
      - "build.zig"
      - "build.zig.zon"
      - "src/cli/main.zig"
      - "site/static/install.sh"
      - "tests/install_script/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release*.yml"
      - "tools/release_*.sh"
      - "site/static/install.sh"
      - "tests/install_script/**"

permissions:
  contents: read

jobs:
  package:
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml

  sums:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS lists all four tarballs and they check
        run: |
          tools/release_sums.sh dist
          test "$(wc -l < dist/SHA256SUMS)" -eq 4
          for t in linux-x86_64 linux-aarch64 macos-arm64 macos-x86_64; do
            grep -q "  mopm-.*-$t\.tar\.gz\$" dist/SHA256SUMS
            tar -tzf dist/mopm-*-"$t".tar.gz | grep -q '/mopm$'
          done
          cat dist/SHA256SUMS

  installer:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell syntax (sh, and bash/dash where present)
        run: |
          for f in site/static/install.sh tools/release_package.sh tools/release_sums.sh tests/install_script/run.sh tests/install_script/mutants.sh; do
            sh -n "$f"
          done
      - name: install.sh against a fake release
        run: tests/install_script/run.sh
      - name: Planted defects in install.sh turn the test red
        run: tests/install_script/mutants.sh
