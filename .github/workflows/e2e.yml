name: e2e

# A separate file from deploy.yml on purpose: the e2e role trusts only this
# workflow (job_workflow_ref in the OIDC sub), so it has far fewer permissions
# than the deploy role even though both run in the same environment.

on:
  workflow_call:
    inputs:
      stage:
        description: Stage to test (beta, gamma or prod)
        required: true
        type: string
      sha:
        description: Commit the health endpoint must report (defaults to the run commit)
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to test
        required: true
        type: choice
        options: [beta, gamma, prod]

permissions:
  contents: read

jobs:
  smoke-linux:
    # The job that can mint AWS credentials runs only from main, never from a PR or another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.stage }}
    permissions:
      id-token: write
      contents: read
    env:
      STAGE: ${{ inputs.stage }}
      ROLE_ARN: ${{ vars.E2E_ROLE_ARN }}
      EXPECTED_SHA: ${{ inputs.sha || github.sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate inputs
        run: |
          case "$STAGE" in beta|gamma|prod) ;; *) echo "bad stage" >&2; exit 1;; esac
          for v in ROLE_ARN AWS_REGION; do
            if [ -z "${!v}" ]; then echo "environment variable for $v is not set on environment $STAGE" >&2; exit 1; fi
          done
      - name: Assume the e2e role through OIDC
        run: |
          set -euo pipefail
          resp=$(curl -sSf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          jwt=$(printf '%s' "$resp" | jq -r .value)
          echo "::add-mask::$jwt"
          creds=$(aws sts assume-role-with-web-identity \
            --role-arn "$ROLE_ARN" \
            --role-session-name "mopm-e2e-${STAGE}-${GITHUB_RUN_ID}" \
            --web-identity-token "$jwt" \
            --duration-seconds 3600 \
            --query Credentials --output json)
          for k in AccessKeyId SecretAccessKey SessionToken; do
            echo "::add-mask::$(printf '%s' "$creds" | jq -r ".$k")"
          done
          {
            echo "AWS_ACCESS_KEY_ID=$(printf '%s' "$creds" | jq -r .AccessKeyId)"
            echo "AWS_SECRET_ACCESS_KEY=$(printf '%s' "$creds" | jq -r .SecretAccessKey)"
            echo "AWS_SESSION_TOKEN=$(printf '%s' "$creds" | jq -r .SessionToken)"
          } >> "$GITHUB_ENV"
      - name: Smoke test, GET /api/v1/health
        run: |
          set -euo pipefail
          domain=$(jq -r .apiDomain "service/config/${STAGE}.json")
          body=$(curl -sSf --retry 5 --retry-delay 10 --retry-all-errors \
            "https://${domain}/api/v1/health")
          echo "health: $body"
          got=$(printf '%s' "$body" | jq -r .stage)
          if [ "$got" != "$STAGE" ]; then
            echo "expected stage $STAGE, health reported $got" >&2
            exit 1
          fi
          # The health endpoint must report the deployed commit (field "commit").
          gotsha=$(printf '%s' "$body" | jq -r '.commit // empty')
          if [ "$gotsha" != "$EXPECTED_SHA" ]; then
            echo "expected commit $EXPECTED_SHA, health reported '${gotsha}'" >&2
            exit 1
          fi

  # macOS job is present but disabled: private-repo macOS minutes are billed at
  # 10x the Linux rate. Enable by removing the `if: false` once the suite needs it.
  smoke-macos:
    if: false
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: echo "placeholder - macOS install and run subset"
