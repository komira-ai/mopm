name: deploy

# Deploys service/infra/stacks to one stage. Reusable (promote.yml calls it) and manual.
# It can mint AWS credentials, so it never runs for a pull request: the guard job
# refuses any ref but refs/heads/main and any event but push or workflow_dispatch,
# and the stage role's trust policy independently requires this file at refs/heads/main.

on:
  workflow_call:
    inputs:
      stage:
        description: Stage to deploy (beta, gamma or prod)
        required: true
        type: string
    outputs:
      deployed_sha:
        description: Commit SHA that was deployed
        value: ${{ jobs.deploy.outputs.deployed_sha }}
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to deploy
        required: true
        type: choice
        options: [beta, gamma, prod]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse anything but main
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "deploy runs only from refs/heads/main (this run: $REF)" >&2; exit 1
          fi
          case "$EVENT" in push|workflow_dispatch) ;; *) echo "deploy does not run for event $EVENT" >&2; exit 1 ;; esac

  deploy:
    needs: guard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.stage }}
    concurrency:
      group: deploy-${{ inputs.stage }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    outputs:
      deployed_sha: ${{ steps.record.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      # Dependencies install before any AWS credential exists, and without lifecycle scripts.
      - name: Install CDK dependencies
        working-directory: service/infra/stacks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate stage
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          case "$STAGE" in beta|gamma|prod) ;; *) echo "bad stage" >&2; exit 1 ;; esac
      - name: Assume the deploy role through OIDC
        env:
          STAGE: ${{ inputs.stage }}
          ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          if [ -z "$ROLE_ARN" ] || [ -z "$AWS_DEFAULT_REGION" ]; then
            echo "DEPLOY_ROLE_ARN and AWS_REGION must be set on the $STAGE environment" >&2; exit 1
          fi
          echo "::add-mask::$ROLE_ARN"
          resp=$(curl -sSf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          jwt=$(printf '%s' "$resp" | jq -r .value)
          echo "::add-mask::$jwt"
          creds=$(aws sts assume-role-with-web-identity \
            --role-arn "$ROLE_ARN" \
            --role-session-name "mopm-deploy-${STAGE}-${GITHUB_RUN_ID}" \
            --web-identity-token "$jwt" \
            --duration-seconds 3600 \
            --query Credentials --output json)
          for k in AccessKeyId SecretAccessKey SessionToken; do
            echo "::add-mask::$(printf '%s' "$creds" | jq -r ".$k")"
          done
          {
            echo "AWS_ACCESS_KEY_ID=$(printf '%s' "$creds" | jq -r .AccessKeyId)"
            echo "AWS_SECRET_ACCESS_KEY=$(printf '%s' "$creds" | jq -r .SecretAccessKey)"
            echo "AWS_SESSION_TOKEN=$(printf '%s' "$creds" | jq -r .SessionToken)"
          } >> "$GITHUB_ENV"
      - name: Deploy stacks
        working-directory: service/infra/stacks
        env:
          STAGE: ${{ inputs.stage }}
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          if [ -z "$CDK_DEFAULT_ACCOUNT" ]; then echo "AWS_ACCOUNT_ID is not set on the $STAGE environment" >&2; exit 1; fi
          echo "::add-mask::$CDK_DEFAULT_ACCOUNT"
          # The stack definitions are the source of truth for hosts; service/config/<stage>.json
          # mirrors them (a test keeps the two equal) and is what e2e reads.
          npx cdk deploy --all --require-approval never \
            --context "stage=${STAGE}" \
            --context "version=sha-${GITHUB_SHA::12}" \
            --context "commit=${GITHUB_SHA}"
      - name: Record deployed commit
        id: record
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "Deployed ${GITHUB_SHA} to ${STAGE}" >> "$GITHUB_STEP_SUMMARY"
