name: release-build

# Builds and packages the mopm CLI for the three release targets (and a .deb for each linux one), and uploads the files as
# workflow artifacts. Called by release.yml (a push to main that tagged a version, which then
# attests, verifies and publishes them) and by release-check.yml (a pull request touching the
# release files, which publishes nothing). It holds no write permission and no credential: it
# cannot create a release.
#
# version: the version to build (1.2.3, no leading v), passed to `zig build -Dversion=`; each binary
# must report exactly that version, or the job fails.

on:
  workflow_call:
    inputs:
      version:
        description: "The version to build (1.2.3)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, zig_target: x86_64-linux-musl, os: ubuntu-24.04, deb_arch: amd64 }
          - { target: linux-aarch64, zig_target: aarch64-linux-musl, os: ubuntu-24.04-arm, deb_arch: arm64 }
          - { target: macos-arm64, zig_target: aarch64-macos, os: macos-14, deb_arch: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Build the release tool (tools/release.zig)
        run: zig build-exe tools/release.zig -O ReleaseSafe -femit-bin="$RUNNER_TEMP/release"
      - name: Build (ReleaseSafe, stripped), check mopm --version, package
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          ZIG_TARGET: ${{ matrix.zig_target }}
        run: '"$RUNNER_TEMP/release" package "$VERSION" "$TARGET" "$ZIG_TARGET" "$RUNNER_TEMP/out"'
      # The linux targets also ship a .deb. It is made from the binary INSIDE the tarball just packaged (unpacked here), so the
      # .deb and the tarball carry the same bytes by construction; release.zig tested and cut_release verify-dir rebuild it
      # from the tarball later and refuse any other bytes. tools/channels deb-package is the one place a .deb is written.
      - name: Build the channels tool (tools/channels)
        if: matrix.deb_arch != ''
        run: zig build-exe tools/channels/main.zig -O ReleaseSafe -femit-bin="$RUNNER_TEMP/channels"
      - name: Package the binary of the tarball as mopm_<version>_<arch>.deb
        if: matrix.deb_arch != ''
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          tar -xzf "$RUNNER_TEMP/out/mopm-$VERSION-$TARGET.tar.gz" -C "$RUNNER_TEMP" "mopm-$VERSION-$TARGET/mopm"
          "$RUNNER_TEMP/channels" deb-package --binary "$RUNNER_TEMP/mopm-$VERSION-$TARGET/mopm" --name mopm --version "$VERSION" --arch "$DEB_ARCH" --packaging packaging/deb --out "$RUNNER_TEMP/out/mopm_${VERSION}_${DEB_ARCH}.deb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/out/*.tar.gz
            ${{ runner.temp }}/out/*.deb
          if-no-files-found: error
          retention-days: 7
          overwrite: true
