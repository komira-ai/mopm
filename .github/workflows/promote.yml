name: promote

# function zips -> beta deploy -> e2e -> gamma deploy -> e2e -> prod deploy -> prod smoke.
# Every stage runs the same commit (the one this run was started on). The first job builds the three Rust Lambda zips once, on the build
# farm, and uploads them as one artifact; every deploy takes that artifact and checks each deployed function's CodeSha256 against its
# sums, so the three stages run the same bytes. A red e2e
# blocks the next stage through needs:. Deploys are fully automated by CEO decision:
# no manual approvals; the e2e suites are the gates. A push to main that touches
# service/**, site/** (or the docs the site renders), the sources of the zips (the Rust workspace and tools/lambda) or the workflows used
# here starts a run; workflow_dispatch is the manual run, and the only one: deploy.yml has no manual trigger of its own, because a
# deploy with no zips would delete the Rust functions. The called workflows refuse any ref but main (function-zips.yml
# does not run on another, so nothing after it does).

on:
  push:
    branches: [main]
    paths:
      - 'service/**'
      # The site build the site stack deploys, and the docs it renders into pages.
      - 'site/**'
      - 'spec/mopm-toml.md'
      - 'docs/mopm-test.md'
      - 'docs/why-and-design.md'
      - 'docs/getting-started.md'
      - 'docs/configuration.md'
      - 'docs/examples.md'
      - 'docs/publishing-a-workspace.md'
      - 'docs/what-mopm-stores.md'
      - '.github/workflows/promote.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/function-zips.yml'
      # What the Rust Lambda zips are built from.
      - 'tools/lambda/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'buildrules.lock.bzl'
      - 'third_party/buildrules/**'
  workflow_dispatch:

# Each called job reads AWS_ACCOUNT_ID and AWS_REGION from its stage's environment
# secrets. A reusable workflow only sees secrets its caller passes, so every call here
# says `secrets: inherit` (GitHub docs: "Reusing workflows", and the workflow syntax
# reference for jobs.<job_id>.secrets). The repository has no repository-level secrets. The function-zips job is the exception: it
# reads no secret (the farm's address and identity are repository variables), so it passes none.

# One promotion at a time, so two pushes never deploy the same stage at once. Runs
# queue (cancel-in-progress: false); GitHub keeps only the newest queued run.
concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  function-zips:
    uses: ./.github/workflows/function-zips.yml
    permissions: { id-token: write, contents: read }

  beta-deploy:
    needs: function-zips
    uses: ./.github/workflows/deploy.yml
    with: { stage: beta, function_zips: function-zips }
    permissions: { id-token: write, contents: read }
    secrets: inherit

  beta-e2e:
    needs: beta-deploy
    uses: ./.github/workflows/e2e.yml
    with: { stage: beta, sha: "${{ needs.beta-deploy.outputs.deployed_sha }}" }
    permissions: { id-token: write, contents: read }
    secrets: inherit

  gamma-deploy:
    needs: beta-e2e
    uses: ./.github/workflows/deploy.yml
    with: { stage: gamma, function_zips: function-zips }
    permissions: { id-token: write, contents: read }
    secrets: inherit

  gamma-e2e:
    needs: gamma-deploy
    uses: ./.github/workflows/e2e.yml
    with: { stage: gamma, sha: "${{ needs.gamma-deploy.outputs.deployed_sha }}" }
    permissions: { id-token: write, contents: read }
    secrets: inherit

  prod-deploy:
    needs: gamma-e2e
    uses: ./.github/workflows/deploy.yml
    with: { stage: prod, function_zips: function-zips }
    permissions: { id-token: write, contents: read }
    secrets: inherit

  prod-smoke:
    needs: prod-deploy
    uses: ./.github/workflows/e2e.yml
    with: { stage: prod, sha: "${{ needs.prod-deploy.outputs.deployed_sha }}" }
    permissions: { id-token: write, contents: read }
    secrets: inherit
