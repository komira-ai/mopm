name: release

# Releases mopm automatically: a push to main that changes more than docs or CI runs the whole test
# suite, builds the CANDIDATE, tests it as a user on every platform, then attests, signs and verifies those candidate files, tags the
# next version only after they verified (a failing attest, signature or verify leaves no orphan tag), and
# publishes exactly those files.
# Nobody tags, approves or runs anything (RELEASING.md); a red stage stops the release.
#
#   beta       the whole of ci.yml on the pushed commit (a workflow_call of it).
#   lint       the whole of lint.yml (hygiene, workflow lint, the release lint) on the pushed commit.
#              Gamma and bake time are a slot for later stages between these and plan.
#   plan       the version the release will have (cut_release plan --sha): the VERSION file's MAJOR.MINOR
#              and the next PATCH. It refuses a commit that a newer release supersedes, and a base below
#              an existing tag. Nothing is written.
#   build      the four binaries (release-build.yml) at that version, each reporting exactly it. These
#              ARE the release files: they are built once, from the commit that is tagged later, and
#              neither rebuilt nor changed after the tests below.
#   beta-user  the candidate tested AS A USER (release-beta-user.yml, tests/drivers/user_beta.zig) on
#              linux x86_64, linux arm64 and macOS 14: every verb against the fake registry, then the
#              documented install path. A red leg on any platform stops the release.
#   attest     only the tarballs the user beta passed (release tested), then SHA256SUMS for the four tarballs, a keyless cosign signature (Sigstore) of each of the
#              five files, and build provenance (actions/attest-build-provenance) for all five. It runs only on
#              main (if: github.ref == 'refs/heads/main'): a manual run from another branch signs nothing, and
#              verify and the rest are skipped with it. Its artifact is signed-assets: not release-*, which
#              is the pattern attest downloads the build's artifacts with (a re-run would merge it back in).
#   verify     cut_release verify-dir on the built files, before anything is published: exactly the ten
#              files, SHA256SUMS matches, every attestation and every signature accepted (pinned to this
#              workflow, the ref, the commit and the trigger, which is the event of this run ($GITHUB_EVENT_NAME):
#              push for a release, workflow_dispatch for a dry run, which signs with that event), the tarball layout, the commit on
#              main. It reads no tag (none exists yet) and uploads the release notes and the pin (artifact
#              notes-pin) and the verified files (verified-assets). A dry run writes no verified.sha256, which
#              publish requires, and publish never runs on a dispatch: nothing a manual run signed is published.
#   tag        the annotated tag v<version> at the pushed commit, the only write before the release; it needs
#              verify. It refuses a commit older than the highest tag (a re-run of an old run) and a
#              version other than the one planned and tested (cut_release tag). The tag ruleset admits only the
#              GitHub App komira-release-bot to create v* tags, so the job mints that App's token (mopm only,
#              contents: write) and gives it to the tag step alone; the job's GITHUB_TOKEN holds contents: read.
#              Without the App's variable and secret this job fails with no tag, and publish never runs.
#   publish    creates the GitHub release from exactly the verified files. A re-run creates no second
#              release and replaces no asset: any asset the release already holds must match byte for byte,
#              or it fails and changes nothing.
#   bump       after publish, opens the komira-internal pull request that moves its `mopm` submodule to this release
#              and turns auto-merge on (cut_release bump-internal), with the App token of komira-release-bot. It is
#              the only job that holds that token (tag holds its own, for mopm), and nothing needs it: a failed bump goes red and un-releases nothing.
#
# A manual run (workflow_dispatch) of main is a dry run: everything up to and including verify, then nothing:
# tag, publish and bump do not run. From any other branch it builds and tests the candidate and stops before attest.
# The only write to this repository by the job token is publish (contents), under a push to main; the tag is
# written through the release bot App's token (above). Both tag and publish run only under a push to main (bump writes to komira-internal, through the App token, and holds contents: read here), and attest (id-token, attestations) by tests/drivers/release_lint.zig, which
# also holds the order of the stages, the data flow between them and the path filter; hygiene.zig holds the
# triggers. A re-run of failed jobs only rebuilds what failed and what depends on it: a changed build
# always re-runs beta-user. install.sh (site/static/install.sh) reads these assets.

on:
  push:
    branches: [main]
    # A push that changes only documentation or CI does not release; anything else does, a
    # VERSION change (MAJOR.MINOR) included. tests/drivers/release_lint.zig checks sample paths.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

# One release run at a time, none cancelled: a cancelled run could leave a tag without its release.
# A manual dry run has a group of its own (its run id), so it cannot displace the one pending push run.
concurrency:
  group: release-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: false

jobs:
  beta:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  plan:
    needs: [beta, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Build the release tool
        run: zig build-exe tools/cut_release.zig -O ReleaseSafe -femit-bin="$RUNNER_TEMP/cut_release"
      - name: The version this commit's release will have (changes nothing)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/cut_release" --repo "$GITHUB_REPOSITORY" plan --sha "$GITHUB_SHA" --out "$GITHUB_OUTPUT"'

  build:
    needs: plan
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  beta-user:
    needs: [plan, build]
    permissions:
      contents: read
    uses: ./.github/workflows/release-beta-user.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  attest:
    needs: [plan, build, beta-user]
    # Nothing is signed or attested unless the commit is on main: a manual run from another branch stops here
    # (verify and everything after it are skipped with it), so no unmerged commit gets a Sigstore entry.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      # cosign v3.0.6, checked by the action against a sha256 it carries.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tested-*
          path: tested
          merge-multiple: true
      - name: Build the release tool
        run: zig build-exe tools/release.zig -O ReleaseSafe -femit-bin="$RUNNER_TEMP/release"
      - name: Attest only the tarballs the user beta passed (the sha256 each leg recorded)
        run: '"$RUNNER_TEMP/release" tested dist tested'
      - name: Write SHA256SUMS (exactly the four tarballs) and check it
        run: '"$RUNNER_TEMP/release" sums dist'
      - name: Sign the four tarballs and SHA256SUMS, keyless (Sigstore; the OIDC identity of this workflow, no key, no secret)
        run: '"$RUNNER_TEMP/release" sign dist'
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/mopm-*.tar.gz
            dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-assets
          path: |
            dist/mopm-*.tar.gz
            dist/SHA256SUMS
            dist/*.sigstore.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  verify:
    needs: [plan, build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-assets
          path: dist
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build the release tool
        run: zig build-exe tools/cut_release.zig -O ReleaseSafe -femit-bin="$RUNNER_TEMP/cut_release"
      - name: Verify the built files (assets, SHA256SUMS, attestations, signatures, layout, tag) and write the notes and the pin
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: '"$RUNNER_TEMP/cut_release" --repo "$GITHUB_REPOSITORY" verify-dir "$VERSION" dist --sha "$GITHUB_SHA" --source-ref "$GITHUB_REF" --trigger "$GITHUB_EVENT_NAME" --notes-out notes'
      # What the release will say, and the pin of the linux-x86_64 tarball.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes-pin
          path: notes/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      # The files publish releases: the ones just verified.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  tag:
    needs: [plan, build, beta-user, verify]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The release bot's key lives only in this environment, which is restricted to main (RELEASING.md).
    environment: release
    # The job's own token only reads: the tag ruleset lets the GitHub App komira-release-bot alone create v* tags,
    # so the tag is created with that App's token (minted below, for this repository only).
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      # Built before any step holds the token, so no build runs beside it.
      - name: Build the release tool
        run: zig build-exe tools/cut_release.zig -O ReleaseSafe -femit-bin="$RUNNER_TEMP/cut_release"
      - name: Mint the installation token of the release bot, for this repository only, with contents write for the tag
        id: tagapp
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: komira-ai
          repositories: mopm
          permission-contents: write
      - name: Create the annotated tag of the planned version at the pushed commit (refused if superseded)
        id: tag
        env:
          GH_TOKEN: ${{ steps.tagapp.outputs.token }}
          PLANNED: ${{ needs.plan.outputs.version }}
        run: '"$RUNNER_TEMP/cut_release" --repo "$GITHUB_REPOSITORY" tag --sha "$GITHUB_SHA" --expect-version "$PLANNED" --out "$GITHUB_OUTPUT"'

  # contents: write creates the release of the EXISTING tag (gh release create --verify-tag, which creates no tag:
  # release_lint.zig holds that the tool passes it); the tag ruleset's creators are the release bot App alone.
  publish:
    needs: [tag, verify]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-assets
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes-pin
          path: notes
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      # Built before any step holds the token, so no build runs beside it.
      - name: Build the release tool
        run: zig build-exe tools/cut_release.zig -O ReleaseSafe -femit-bin="$RUNNER_TEMP/cut_release"
      - name: Create the release from exactly the verified files (a re-run adds only what is missing)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: '"$RUNNER_TEMP/cut_release" --repo "$GITHUB_REPOSITORY" publish "$VERSION" dist --verified notes/verified.sha256 --notes notes/release-notes.md'

  # The last stage, after the release exists. Its write is on ANOTHER repository: the App token of
  # komira-release-bot (installed on komira-internal only) opens a pull request there that moves the
  # `mopm` submodule to the released commit, with auto-merge; komira-internal merges it when its checks and
  # its bump guard pass. Here the job holds contents: read, and it is the only job that may name the App
  # token (release_lint.zig). Nothing needs it: a failed bump goes red and un-releases nothing; re-run this
  # job (RELEASING.md). The token is minted after the tool is built and goes only to the step that runs it.
  bump:
    needs: [tag, publish]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Same environment as tag: the key is readable only here and in tag (RELEASING.md).
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      # Built before any step holds the token, so no build runs beside it.
      - name: Build the release tool
        run: zig build-exe tools/cut_release.zig -O ReleaseSafe -femit-bin="$RUNNER_TEMP/cut_release"
      - name: Mint the installation token of the release bot, for komira-internal only
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: komira-ai
          repositories: komira-internal
          permission-contents: write
          permission-pull-requests: write
      - name: Open the komira-internal pull request that moves its mopm submodule to this release, with auto-merge (idempotent)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: '"$RUNNER_TEMP/cut_release" --repo "$GITHUB_REPOSITORY" bump-internal --version "$VERSION" --sha "$GITHUB_SHA" --internal-repo komira-ai/komira-internal --submodule mopm --workdir "$RUNNER_TEMP/bump"'
