name: release

# Releases mopm automatically: a push to main that changes more than docs or CI runs the whole test
# suite, tags the next version, builds, attests and verifies the files, and publishes the release.
# Nobody tags, approves or runs anything (RELEASING.md); a red stage stops the release.
#
#   beta     the whole of ci.yml on the pushed commit (a workflow_call of it). Gamma and bake time are
#            a slot for later stages between beta and tag.
#   tag      the annotated tag v<version> at the pushed commit, the only write before the build. The
#            version is the VERSION file's MAJOR.MINOR and the next PATCH (cut_release plan, tag).
#   build    the four binaries (release-build.yml), each reporting exactly this version.
#   attest   SHA256SUMS for the four tarballs, and build provenance (actions/attest-build-provenance)
#            for all five files.
#   verify   cut_release verify-dir on the BUILT files, before anything is published: exactly the five
#            files, SHA256SUMS matches, every attestation accepted (pinned to this workflow, the ref and
#            the commit), the tarball layout, the tag on main. It uploads the release notes and the pin
#            (artifact release-notes) and the verified files (verified-assets).
#   publish  creates the GitHub release from exactly the verified files. A re-run creates no second
#            release and replaces no asset: any asset the release already holds must match byte for byte,
#            or it fails and changes nothing.
#
# A manual run (workflow_dispatch) is a dry run: beta, then `plan`, which prints the version the next
# release would get. Nothing is tagged or published. Writes are held to tag (contents) and publish
# (contents), both under a push to main, and attest (id-token, attestations) by tests/drivers/release_lint.zig,
# which also holds the order of the stages and the path filter; hygiene.zig holds the triggers.
# install.sh (site/static/install.sh) reads these assets.

on:
  push:
    branches: [main]
    # A push that changes only documentation or CI does not release; anything else does, a
    # VERSION change (MAJOR.MINOR) included. tests/drivers/release_lint.zig checks sample paths.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

# One release run at a time, none cancelled: a cancelled run could leave a tag without its release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  beta:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  plan:
    needs: beta
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Build the release tool
        run: zig build-exe tools/cut_release.zig -O ReleaseSafe -femit-bin="$RUNNER_TEMP/cut_release"
      - name: The version the next release would get (a dry run changes nothing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/cut_release" --repo "$GITHUB_REPOSITORY" plan'

  tag:
    needs: beta
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      # Built before any step holds the token, so no build runs beside it.
      - name: Build the release tool
        run: zig build-exe tools/cut_release.zig -O ReleaseSafe -femit-bin="$RUNNER_TEMP/cut_release"
      - name: Create the annotated tag of the next version at the pushed commit
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/cut_release" --repo "$GITHUB_REPOSITORY" tag --sha "$GITHUB_SHA" --out "$GITHUB_OUTPUT"'

  build:
    needs: tag
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.tag.outputs.version }}

  attest:
    needs: [tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Write SHA256SUMS (exactly the four tarballs) and check it
        run: |
          zig build-exe tools/release.zig -O ReleaseSafe -femit-bin="$RUNNER_TEMP/release"
          "$RUNNER_TEMP/release" sums dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/mopm-*.tar.gz
            dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/mopm-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: [tag, build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      - name: Build the release tool
        run: zig build-exe tools/cut_release.zig -O ReleaseSafe -femit-bin="$RUNNER_TEMP/cut_release"
      - name: Verify the built files (assets, SHA256SUMS, attestations, layout, tag) and write the notes and the pin
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: '"$RUNNER_TEMP/cut_release" --repo "$GITHUB_REPOSITORY" verify-dir "$VERSION" dist --sha "$GITHUB_SHA" --source-ref "$GITHUB_REF" --notes-out notes'
      # What the release will say, and the pin of the linux-x86_64 tarball.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/
          if-no-files-found: error
          retention-days: 7
      # The files publish releases: the ones just verified.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [tag, verify]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-assets
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Install Zig 0.12.0 (sha256-pinned)
        run: echo "$(tools/install_zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_PATH"
      # Built before any step holds the token, so no build runs beside it.
      - name: Build the release tool
        run: zig build-exe tools/cut_release.zig -O ReleaseSafe -femit-bin="$RUNNER_TEMP/cut_release"
      - name: Create the release from exactly the verified files (a re-run adds only what is missing)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: '"$RUNNER_TEMP/cut_release" --repo "$GITHUB_REPOSITORY" publish "$VERSION" dist --verified notes/verified.sha256 --notes notes/release-notes.md'
