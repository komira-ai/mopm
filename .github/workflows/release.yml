name: release

# Publishes a mopm release. The trigger is the CEO pushing a tag v<major>.<minor>.<patch>; nothing
# uploads on a pull request or a push to main. release-build.yml builds the four binaries, refusing
# any whose `mopm --version` is not the tag. This file then writes SHA256SUMS, attests the build
# provenance of the tarballs and SHA256SUMS (actions/attest-build-provenance) and creates the GitHub
# release with them, using only the workflow's own token. Its permissions are on the publish job alone.
# It is the one workflow with contents: write, id-token: write (for the attestation's signing) and
# attestations: write; .github/scripts/workflow_lint.rb and hygiene.rb pin its trigger to tags.
# install.sh (site/static/install.sh) reads these assets.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        run: |
          tools/release_sums.sh dist
          test "$(ls dist/mopm-*.tar.gz | wc -l)" -eq 4
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/mopm-*.tar.gz
            dist/SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=
          case "$TAG" in *-*) flags=--prerelease ;; esac
          gh release create "$TAG" dist/mopm-*.tar.gz dist/SHA256SUMS --verify-tag --title "mopm $TAG" --generate-notes $flags
