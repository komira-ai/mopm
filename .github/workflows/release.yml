          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: '"$RUNNER_TEMP/apt_publish" write --bucket "$APT_BUCKET" --distribution "$APT_DISTRIBUTION_ID" --hostname "$APT_HOSTNAME" --next "$RUNNER_TEMP/apt-next" --debs "$RUNNER_TEMP/apt-debs" --out "$GITHUB_OUTPUT" --last'
