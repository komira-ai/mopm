name: hygiene

# Public-repo guard. Fails a pull request that adds an AWS key, an account id, a private
# key or token, a privileged PR trigger, or an id-token grant outside the deploy
# workflows, and checks the structure of every workflow. It holds no credentials and
# requests no id-token. No path filter: all jobs always report, so all can be required.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan tracked files and workflow triggers
        run: ruby .github/scripts/hygiene.rb

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check syntax of the scripts themselves
        run: |
          ruby -c .github/scripts/hygiene.rb
          ruby -c .github/scripts/workflow_lint.rb
      - name: Lint workflows (pins, permissions, run scripts, promotion chain)
        run: ruby .github/scripts/workflow_lint.rb

  lint-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the lint scripts against known-bad and known-clean fixtures
        run: ruby tests/lint/run.rb
