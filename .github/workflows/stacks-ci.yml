name: stacks-ci
on:
  pull_request:
    paths:
      - 'service/infra/stacks/**'
      - '.github/workflows/stacks-ci.yml'
  push:
    branches: [main]
    paths:
      - 'service/infra/stacks/**'
      - '.github/workflows/stacks-ci.yml'
permissions:
  contents: read
concurrency:
  group: stacks-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stacks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: service/infra/stacks
    env:
      # Dummy values: synth never talks to AWS and no real account id is in this repo.
      CDK_DEFAULT_ACCOUNT: '111111111111'
      CDK_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
      # No lockfile yet (first PR): versions in package.json are exact, a lockfile follows.
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Synth all stages with dummy context
        run: |
          for stage in beta gamma prod; do
            npx cdk synth --quiet -c stage=$stage -c hostedZoneId=Z0DUMMYZONE -c version=ci --output cdk.out/$stage
          done
