name: access-ci
on:
  pull_request:
    paths: ['service/infra/access/**', '.github/workflows/access-ci.yml']
  push:
    branches: [main]
    paths: ['service/infra/access/**', '.github/workflows/access-ci.yml']
permissions:
  contents: read
concurrency:
  group: access-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: service/infra/access
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
      - name: bash -n
        run: bash -n bootstrap.sh
      - name: bootstrap.sh is a dry run by default
        run: |
          out="$(./bootstrap.sh --stage beta --account 123456789012 --region us-west-2 --profile p)"
          echo "$out" | grep -q '^DRY-RUN: aws iam create-policy'
          if echo "$out" | grep -q '^+ '; then exit 1; fi
          if ./bootstrap.sh --stage dev --account 123456789012 --region r --profile p; then exit 1; fi
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx jest --ci
