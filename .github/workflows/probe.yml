name: probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  repl:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: env
        run: |
          echo "$(tools/install_pixi.sh "$RUNNER_TEMP/pixi")" >> "$GITHUB_PATH"
      - name: mojo env
        run: |
          mkdir -p "$RUNNER_TEMP/mojo-env"
          cp tests/e2e/pixi.toml "$RUNNER_TEMP/mojo-env/pixi.toml"
          pixi install --manifest-path "$RUNNER_TEMP/mojo-env/pixi.toml"
      - name: diagnose
        run: |
          e="$RUNNER_TEMP/mojo-env/.pixi/envs/default"
          export MODULAR_HOME="$e/share/max"
          /usr/bin/sw_vers || true
          xcode-select -p || true
          for d in "$(xcode-select -p)/../SharedFrameworks/LLDB.framework/Versions/A/Resources/debugserver" "$(xcode-select -p)/Library/PrivateFrameworks/LLDB.framework/Versions/A/Resources/debugserver" /Library/Developer/CommandLineTools/Library/PrivateFrameworks/LLDB.framework/Versions/A/Resources/debugserver; do
            [ -x "$d" ] && echo "found $d"
          done
          echo "--- plain repl"
          printf 'print(1 + 1)\n\n' | "$e/bin/mojo" repl 2>&1 | grep -v Crashpad | tail -5 || true
          ds="$(xcode-select -p)/../SharedFrameworks/LLDB.framework/Versions/A/Resources/debugserver"
          [ -x "$ds" ] || ds=/Library/Developer/CommandLineTools/Library/PrivateFrameworks/LLDB.framework/Versions/A/Resources/debugserver
          echo "--- repl with LLDB_DEBUGSERVER_PATH=$ds"
          printf 'print(1 + 1)\n\n' | LLDB_DEBUGSERVER_PATH="$ds" "$e/bin/mojo" repl 2>&1 | grep -v Crashpad | tail -5 || true
          echo "--- debugserver alone"
          "$e/bin/debugserver" --version 2>&1 | head -3 || true
          echo "--- crash reports"
          ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -5 || true
          f=$(ls -t ~/Library/Logs/DiagnosticReports/debugserver* 2>/dev/null | head -1)
          [ -n "$f" ] && head -60 "$f" | sed "s|$e|<E>|g" || true
