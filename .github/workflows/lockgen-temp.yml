name: lockgen-temp

# TEMPORARY: produces package-lock.json for the two CDK packages without running npm locally.
# Removed in the next commit.

on:
  pull_request:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Generate lockfiles
        run: |
          for d in service/infra/stacks service/infra/access; do
            (cd "$d" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: locks
          path: |
            service/infra/stacks/package-lock.json
            service/infra/access/package-lock.json
          retention-days: 3
