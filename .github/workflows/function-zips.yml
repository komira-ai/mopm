# Builds the Rust Lambda zips (web-login, web-session, tutorial-sandbox) once for a promotion, on the build farm, and uploads them as one
# artifact named function-zips: the three zips and `sums` (a sha256 line per zip). promote.yml calls this before its first deploy; every
# stage's deploy downloads that artifact and checks each deployed function's CodeSha256 against the sums, so beta, gamma and prod run
# the same bytes.
#
# The farm is connected as in farm.yml (the same pinned farm-connect, the same repository variables); the worker properties it writes
# under [komira_re] reach buildrules through the [buildrules_re] mapping in .buckconfig. Unlike farm.yml this file is only
# ever called by promote.yml, so with no farm configured the build FAILS: a deploy must never go out with zips nothing built. It holds no
# secret and no environment; its id-token grant is for farm-connect alone. The hygiene and workflow lints (//:hygiene, //:workflows)
# hold it to that.
name: function-zips

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    # Main only: a manual promotion from another branch never logs in to the farm nor builds that branch's zips (deploy.yml's guard
    # refuses the rest of such a run).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # for farm-connect only: the token the farm's network trusts
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The condition reads the variable without putting its value in a step's environment, which GitHub prints in the log.
      - name: the farm is not configured
        if: ${{ vars.FARM_ADDRESS == '' }}
        run: |
          echo "::error title=function-zips::the repository variable FARM_ADDRESS is not set, so nothing built the function zips. Set it, or nothing deploys."; exit 1
      # The same komira commit as in farm.yml and commit_hash in .buckconfig; bump them together.
      - name: connect to the farm
        if: ${{ vars.FARM_ADDRESS != '' }}
        uses: komira-ai/komira/.github/actions/farm-connect@aefee53266277c55b40ccbf35782a296ceecf687
        with:
          ts-client-id: ${{ vars.TS_CLIENT_ID }}
          ts-audience: ${{ vars.TS_AUDIENCE }}
          farm-address: ${{ vars.FARM_ADDRESS }}
          farm-instance: ${{ vars.FARM_INSTANCE }}
          farm-properties: ${{ vars.FARM_LINUX_X86_64_PROPERTIES }}
          tls: ${{ vars.FARM_TLS || 'false' }}
      # The target's one output is a directory: web-login.zip, web-session.zip, tutorial-sandbox.zip and sums. --remote-only makes buck2
      # reject any action that cannot run on the farm, so nothing runs on the runner; with no worker property set (no farm) the platform
      # does not load and the build fails.
      - name: buck2 build the function zips
        if: ${{ vars.FARM_ADDRESS != '' }}
        run: ./buck2 build --remote-only //service/infra/stacks:function_zips --out "$RUNNER_TEMP/function-zips"
      # Seven days: a promotion runs from one push and its stages follow within hours; a re-run of a stage reads the same artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: function-zips
          path: ${{ runner.temp }}/function-zips
          retention-days: 7
          if-no-files-found: error
      - name: Stop buck2
        if: ${{ always() && vars.FARM_ADDRESS != '' }}
        run: ./buck2 kill || true
