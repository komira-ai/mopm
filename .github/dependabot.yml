version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    # Major bumps of actions wait for review (as npm's do below).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /service/infra/stacks
    schedule:
      interval: weekly
    groups:
      aws-cdk:
        patterns: ["aws-cdk-lib", "aws-cdk", "constructs"]
      dev-tooling:
        patterns: ["typescript", "ts-jest", "jest", "@types/*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /service/infra/access
    schedule:
      interval: weekly
    groups:
      aws-cdk:
        patterns: ["aws-cdk-lib", "aws-cdk", "constructs"]
      dev-tooling:
        patterns: ["typescript", "ts-jest", "jest", "@types/*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /service/infra/dns
    schedule:
      interval: weekly
    groups:
      aws-cdk:
        patterns: ["aws-cdk-lib", "aws-cdk", "constructs"]
      dev-tooling:
        patterns: ["typescript", "ts-jest", "jest", "@types/*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
