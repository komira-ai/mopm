version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    # Major bumps of actions wait for review (as npm's do below).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # Every npm entry waits 7 days after a release before Dependabot proposes it (cooldown applies to
  # version updates, not security updates): a newly published malicious version is usually pulled
  # within days. tests/drivers/hygiene.zig refuses an npm entry without it, and an npm package
  # (a package-lock.json) without an entry.
  - package-ecosystem: npm
    directory: /service/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-tooling:
        patterns: ["typescript", "ts-jest", "jest", "@types/*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /service/infra/stacks
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      aws-cdk:
        patterns: ["aws-cdk-lib", "aws-cdk", "constructs"]
      dev-tooling:
        patterns: ["typescript", "ts-jest", "jest", "@types/*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /service/infra/access
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      aws-cdk:
        patterns: ["aws-cdk-lib", "aws-cdk", "constructs"]
      dev-tooling:
        patterns: ["typescript", "ts-jest", "jest", "@types/*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /service/infra/dns
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      aws-cdk:
        patterns: ["aws-cdk-lib", "aws-cdk", "constructs"]
      dev-tooling:
        patterns: ["typescript", "ts-jest", "jest", "@types/*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-tooling:
        patterns: ["typescript", "ts-jest", "jest", "fast-check", "@types/*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
