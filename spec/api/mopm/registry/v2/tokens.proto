syntax = "proto3";

package mopm.registry.v2;

import "mopm/registry/v2/types.proto";
import "mopm/registry/v2/options.proto";

// `publish` creates, uploads, reads, aborts and commits groups and publishes single versions; it may also yank.
// `yank` yanks. `stage` prepares a group (create, read, abort) and nothing else: it cannot commit a group, publish a
// single version, yank or create a package (save that a token from the OIDC exchange creates the empty packages it
// names), and it is not enough alone where `publish` or `yank` is asked for.
enum TokenScope {
  TOKEN_SCOPE_UNSPECIFIED = 0;
  TOKEN_SCOPE_PUBLISH = 1;
  TOKEN_SCOPE_YANK = 2;
  TOKEN_SCOPE_STAGE = 3;
}

// An explicit list of full names, or the string `all_current`.
message TokenPackages {
  option (schema) = {union: true};
  message Names {
    option (schema) = {wrapper: true};
    repeated FullName value = 1 [(field) = {min_items: 1, unique_items: true}];
  }
  oneof packages {
    Names names = 1;
    string all_current = 2 [(field) = {const: "all_current"}];
  }
}

message CreateTokenRequest {
  string name = 1 [(field) = {required: true, min_length: 1, max_length: 80}];
  repeated TokenScope scopes = 2 [(field) = {required: true, min_items: 1, unique_items: true}];
  TokenPackages packages = 3 [(field) = {required: true}];
  int64 expires_in_days = 4 [(field) = {required: true, minimum: 1, maximum: 90}];
}

message CreateTokenResponse {
  string id = 1 [(field) = {required: true, min_length: 1}];
  string name = 2 [(field) = {required: true}];
  Token token = 3 [(field) = {required: true}];
  repeated TokenScope scopes = 4 [(field) = {required: true}];
  TokenPackages packages = 5 [(field) = {required: true}];
  Timestamp expires_at = 6 [(field) = {required: true}];
}

message TokenMeta {
  string id = 1 [(field) = {required: true, min_length: 1}];
  string name = 2 [(field) = {required: true}];
  repeated TokenScope scopes = 3 [(field) = {required: true}];
  TokenPackages packages = 4 [(field) = {required: true}];
  Timestamp created_at = 5 [(field) = {required: true}];
  Timestamp expires_at = 6 [(field) = {required: true}];
  Timestamp last_used_at = 7 [(field) = {nullable: true}];
}

message TokenList {
  repeated TokenMeta tokens = 1 [(field) = {required: true}];
}
