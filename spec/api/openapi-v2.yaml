# Generated by tools/api_gen.zig from spec/api/mopm/registry/v2/*.proto (sources sha256 0aac2bb4653455110c313b186a5742fedfd10281ab1615eaaa591dfd7702cfda); do not edit, run 'zig build gen-api'.
openapi: "3.1.0"
info:
  title: "mopm registry API"
  version: "2.0.0"
  summary: "The HTTP API of the hosted mopm registry, version 2, with package names in owner namespaces."
  description: |
    This file is the contract between the `mopm` command line tool and the
    hosted registry at mopm.dev for `/api/v2`. It is served beside
    `spec/api/openapi.yaml` (`/api/v1`) on the same host. The two never meet
    over a package: a v1 package has a flat name (`json`) and is seen only by
    `/api/v1`; a v2 package has a full name (`komira-ai/json`) and is seen only
    by `/api/v2`. An operation that names no package (`/health`, `/auth/device`,
    `/auth/device/poll`, listing and revoking tokens in `/me/tokens`) behaves
    the same at both prefixes. A publish (`/publishes/{publish_id}`) is seen only
    by the prefix its package's name belongs to: a flat name's by `/api/v1`, a
    full name's by `/api/v2`. The design is
    `docs/design/namespaces.md`.

    ## Versioning rule (additive only)

    All paths live under `/api/v2`. Within `/api/v2`:

    - A change may add an optional request field, add a response field, add an
      endpoint, add a value to a response enum, or add an error code.
    - A change may NOT remove or rename a field, make an optional request field
      required, tighten validation of a request that was accepted before,
      change the type, format or meaning of a field, change an error code or the
      HTTP status of an existing error, or change the cursor format.
    - Clients MUST ignore response fields they do not know, MUST treat an
      unknown enum value as "unknown" rather than as an error, and MUST treat
      an unknown error code as the generic failure of its HTTP status class.
    - The static index (`spec/index.md`) is versioned separately by
      `index_version` in `config.json`; a CLI refuses an index version it does
      not know.

    ## Conventions

    - Bodies are JSON (`application/json`, UTF-8). Timestamps are RFC 3339 in UTC.
    - Every response carries the header `x-mopm-request-id`. The CLI prints it
      with any error.
    - Errors have the shape `{"error": {"code", "message", "hint"}}`. The
      stable codes are the `ErrorCode` enum; the table of code, HTTP status,
      message template and hint is the `x-mopm-errors` extension at the end of
      this file. Clients branch on `code`, never on `message`.
    - A path that is not an operation of this API, or a method the path does
      not take, is answered `route_not_found` (404). It is never a 400: the
      request was well formed, there is just nothing there.
    - Writes need `Authorization: Bearer <token>`. Reads and installs never
      need a token.
    - A package is named by its full name `<namespace>/<name>`; in a path it is
      the two segments `{namespace}` and `{name}`. The namespace is a GitHub
      login in lower case (at most 39 characters), the name is a normalised
      name (lowercase; letters, digits and `_`). Nothing is normalised for the
      caller: `Komira-AI` is refused with `invalid_namespace`, and a
      non-normalised name with `invalid_name`.
    - The name is the package's import name. It is not a Mojo keyword or
      builtin, nor `mopm`, `mojo`, `max`, `modular`, `std` or `stdlib`, nor a
      top-level module of the Mojo standard library; `createPackage` refuses
      those with `name_reserved`.
    - Versions in paths start with a digit, so a version never collides with
      the literal path segment `versions`.
    - A version is `MAJOR.MINOR.PATCH` (see `Version`). Any other spelling
      (`1.0`, `1.0.0.0`, `1.0rc1`, `1.0.0-rc.1`) is refused with
      `invalid_version`, so a version has one spelling and publishing the same
      version twice is refused with `version_exists`.
    - Lists are paginated with an opaque `cursor`; `next_cursor` is null on the
      last page.

    ## Who may write

    A package belongs to its namespace; there are no package owners, no
    ownership invitations and no claim. In a `user` namespace the account bound
    to it may write; in an `org` namespace an account that is a member of it
    (an `owner` or a `member`, a list kept in mopm and read at each write, with
    no call to GitHub). GitHub is asked about an organization once, when its
    namespace is registered: the account that registers it (`createNamespace`,
    then `pollNamespace`, a GitHub device flow that asks for `read:org` for that
    one call, and the token is not kept) must be an active admin of the GitHub
    organization, and becomes the first `owner`. An `owner` adds and removes
    members and changes roles (`setMember`, `removeMember`); a `member` may
    create packages and publish. A trusted publisher of a namespace may write in
    it, and its token is minted for that namespace. `createPackage` checks the right to write before it
    answers: a session of an account that can write the namespace, an API token
    with `publish` whose `packages` names the full name, or a trusted
    publisher's token minted for it.

    ## Authentication

    Tokens look like `mopm_` followed by lowercase base32 characters. The
    prefix lets secret scanners recognise them. There are four ways a bearer
    token is accepted, named below as security schemes. A request with no token
    where one is required gets `token_missing`.
  license:
    name: "Apache-2.0"
    identifier: "Apache-2.0"
servers:
  - url: "https://{host}/api/v2"
    description: |
      One API host per stage, `api.<site>`: prod is api.mopm.dev, gamma is
      api.gamma.mopm.dev and beta is api.beta.mopm.dev. The site `<site>`
      (mopm.dev, gamma.mopm.dev, beta.mopm.dev) is the website, and the conda
      channel is conda.<site>; a namespace's channel is conda.<site>/<namespace>/.
    variables:
      host:
        default: "api.mopm.dev"
        enum:
          - "api.mopm.dev"
          - "api.gamma.mopm.dev"
          - "api.beta.mopm.dev"
tags:
  - name: "auth"
  - name: "tokens"
  - name: "publish"
  - name: "packages"
  - name: "namespaces"
  - name: "me"
  - name: "meta"
security: []
paths:
  /health:
    get:
      operationId: "getHealth"
      tags:
        - "meta"
      summary: "Liveness and mode of the stage."
      security: []
      responses:
        "200":
          description: "The stage is up. `read_only` is true when new uploads are refused."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /auth/device:
    post:
      operationId: "startDeviceLogin"
      tags:
        - "auth"
      summary: "Start the device login flow (CLI login through GitHub)."
      description: |
        Returns a user code to show the person and a device code to poll with.
        The approval page shows the requesting client and expires in ten
        minutes. Throttled per IP and per device code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceStartRequest"
      responses:
        "200":
          description: "A device login was started."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStartResponse"
        default:
          $ref: "#/components/responses/Error"
  /auth/device/poll:
    post:
      operationId: "pollDeviceLogin"
      tags:
        - "auth"
      summary: "Poll a started device login."
      description: |
        Poll no faster than `interval` seconds. While the person has not
        decided, `status` is `pending`. `approved` carries a session token;
        the session is fresh (see `fresh_until`) so that the CLI can mint an
        API token right after login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePollRequest"
      responses:
        "200":
          description: "The state of the login."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePollResponse"
        default:
          $ref: "#/components/responses/Error"
  /auth/oidc/exchange:
    post:
      operationId: "exchangeOidcToken"
      tags:
        - "auth"
      summary: "Exchange a CI identity token for a short-lived publish token."
      description: |
        The token is valid for 10 minutes, may only publish (or, with `purpose: stage`, only stage), and only for the
        package versions named in the request (one, or the `packages` list), each a full name. The CI identity must
        match a trusted publisher of the package's namespace: its repository
        and owner ids (the owner id is the namespace's GitHub id), workflow file and (when the publisher names one)
        environment, the ref it runs on (`refs/heads/main` unless the
        publisher names another) and the event that started it (a push or a
        manual dispatch). The call mints a token and creates nothing: a package that does not exist is created with
        `createPackage`, which the token minted for the namespace may do, and the token names that namespace. A CI identity token can be exchanged once; a second
        exchange of the same token is refused as `oidc_token_invalid`.

        `purpose` is optional: `publish` (the default, the token this call has always minted) or `stage`. A `stage` token
        has the one scope `stage`: the same packages, versions, namespace and life as the `publish` token of the same request,
        but it can only prepare a group (`createGroup`, `getGroup`, `abortGroup`); `commitGroup`, `commitPublish`, `setYanked`
        and `yankGroup` refuse it as `scope_missing`. Any other `purpose` is
        `invalid_request`, before the CI identity token is spent.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcExchangeRequest"
      responses:
        "200":
          description: "A publish (or, for `purpose: stage`, a stage) token for one package version."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcExchangeResponse"
        default:
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: "getMe"
      tags:
        - "me"
      summary: "The calling user and the namespaces they can write in."
      security:
        - userToken: []
      responses:
        "200":
          description: "The user behind the token."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeV2"
        default:
          $ref: "#/components/responses/Error"
  /me/tokens:
    post:
      operationId: "createToken"
      tags:
        - "tokens"
      summary: "Create an API token."
      description: |
        Needs a fresh session. The secret is shown once and stored hashed.
        `packages` is mandatory: an explicit list of full names, or `all_current`, a snapshot
        of the packages of the namespaces the caller can write in at creation time (not future packages). A listed
        full name may be a package that does not exist yet, in a namespace the caller can write in.
      security:
        - freshSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: "The token. `token` is the only time the secret is returned."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenResponse"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: "listTokens"
      tags:
        - "tokens"
      summary: "List the caller's tokens (metadata only, never secrets)."
      security:
        - freshSession: []
      responses:
        "200":
          description: "The caller's live tokens."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenList"
        default:
          $ref: "#/components/responses/Error"
  /me/tokens/{token_id}:
    delete:
      operationId: "revokeToken"
      tags:
        - "tokens"
      summary: "Revoke a token. Revocation is immediate."
      security:
        - freshSession: []
      parameters:
        - $ref: "#/components/parameters/TokenId"
      responses:
        "204":
          description: "The token is revoked."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
        default:
          $ref: "#/components/responses/Error"
  /namespaces:
    post:
      operationId: "createNamespace"
      tags:
        - "namespaces"
      summary: "Start registering an organization namespace."
      description: |
        Needs a fresh session. The namespace string is the lower-case login of a GitHub organization. A user's
        namespace is not made here: it is made at the user's first login. The call refuses a namespace outside the
        grammar (`invalid_namespace`), a reserved one (`namespace_reserved`) and one that any account, user or
        organization, already holds (`namespace_taken`). A caller that holds no user namespace of its own, which happens when
        its login is outside the grammar, is reserved or is held by another account, is `user_not_found`, because it could
        not be named as a member. None of these asks GitHub.

        Otherwise it starts a GitHub device flow that asks for the scope `read:org` and answers 202 with the code to show
        the person, as `startDeviceLogin` does. The flow is bound to the caller; it lives ten minutes. Nothing is created
        until `pollNamespace` answers `created`.
      security:
        - freshSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNamespaceRequest"
      responses:
        "202":
          description: "The registration was started; the person approves on GitHub and the caller polls."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStartResponse"
        default:
          $ref: "#/components/responses/Error"
  /namespaces/poll:
    post:
      operationId: "pollNamespace"
      tags:
        - "namespaces"
      summary: "Poll a started organization registration."
      description: |
        Poll no faster than `interval` seconds, with a session or a user token of the account that started the
        registration (another account's `device_code` is `device_code_unknown`). While the person has not decided,
        `status` is `pending`; `denied` and `expired` end the flow.

        When GitHub approves, the registry reads, with the one-time token, the account that approved (its id must be
        the caller's: otherwise `github_account_mismatch`) and that account's membership of the organization. The
        namespace is created only when the membership is `active`, its role is `admin` and the organization's current
        login in lower case is the namespace; any other answer of GitHub (no membership, a pending invitation, the
        role `member` or `billing_manager`, an organization that restricts OAuth apps, another current login) is
        `not_org_admin`. The organization's GitHub id is stored on the namespace and the caller becomes its first
        `owner`. The token is discarded and nothing about the organization is asked of GitHub afterwards.

        `created` answers once; the string taken in the meantime is `namespace_taken`.
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePollRequest"
      responses:
        "200":
          description: "The state of the registration."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespacePollResponse"
        default:
          $ref: "#/components/responses/Error"
  /namespaces/{namespace}:
    get:
      operationId: "getNamespace"
      tags:
        - "namespaces"
      summary: "A namespace."
      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: "The namespace, its kind and its GitHub account."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceInfo"
        default:
          $ref: "#/components/responses/Error"
  /namespaces/{namespace}/members:
    get:
      operationId: "listMembers"
      tags:
        - "namespaces"
      summary: "The members of an organization namespace."
      description: |
        Readable by an owner or a member of the namespace; any other account is `not_namespace_member`. A user
        namespace has no members (`invalid_request`). Sorted by `user`.
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: "The members."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        default:
          $ref: "#/components/responses/Error"
  /namespaces/{namespace}/members/{user}:
    put:
      operationId: "setMember"
      tags:
        - "namespaces"
      summary: "Add a member to an organization namespace, or change its role."
      description: |
        Needs a fresh session of an `owner` of the namespace (a `member` is `not_namespace_owner`; an account that is
        is not in it at all is `not_namespace_member`). `user` is a mopm username: the user namespace of the account, which an
        account gets at its first login; any other string is `user_not_found`. Answers 201 when the account was
        added, 200 when its role changed or already was the one asked. Making the only owner a `member` is
        `last_owner`.
      security:
        - freshSession: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/User"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMemberRequest"
      responses:
        "201":
          description: "The account was added."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "200":
          description: "The account was a member; its role is now the one asked."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: "removeMember"
      tags:
        - "namespaces"
      summary: "Remove a member from an organization namespace."
      description: |
        Needs a fresh session of an `owner`. The removal takes effect at once: the next write of that account in the
        namespace is `not_namespace_member`. An owner may remove themselves while another owner remains; the only
        owner is `last_owner`. An account that is not a member is `member_not_found`.
      security:
        - freshSession: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/User"
      responses:
        "204":
          description: "The account is no longer a member."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
        default:
          $ref: "#/components/responses/Error"
  /packages:
    get:
      operationId: "searchPackages"
      tags:
        - "packages"
      summary: "List or search packages."
      description: |
        Filters only what the index serves: a prefix (`q`) and a sort order. `q` is a name prefix, or
        `<namespace>/` with an optional name prefix to list one namespace's packages. Filtering by platform, Mojo
        version or native library is not offered.
      security: []
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: "One page of packages."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageList"
        default:
          $ref: "#/components/responses/Error"
  /packages/{namespace}/{name}:
    get:
      operationId: "getPackage"
      tags:
        - "packages"
      summary: "Package information."
      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: "The package, its namespace and its versions."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageInfoV2"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: "createPackage"
      tags:
        - "packages"
      summary: "Create a package in a namespace."
      description: |
        The only way to create a package; it takes no body. The right to write the namespace is checked before anything
        else (see "Who may write" above): a caller that cannot write it gets `not_namespace_member`, or
        `namespace_not_found` when there is no such namespace. The name must be a possible import name: a Mojo keyword
        or builtin, `mopm`, `mojo`, `max`, `modular`, `std`, `stdlib` or a top-level module of the Mojo standard library
        is `name_reserved`, and its message says which. A package has no claim and no expiry. Creation is rate limited per
        account and per token: 50 a UTC day each, unless the operator of the registry has set a higher daily limit for the
        account; over it the call is `rate_limited` and `Retry-After` says when the day ends. An API token that has only
        the `stage` scope is refused (`scope_missing`).

        Answers 201 with the package it made, or 200 with the package as it is when it already exists.
      security:
        - userToken: []
        - publishToken: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "201":
          description: "The package was created."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageInfoV2"
        "200":
          description: "The package already exists; it is returned as it is."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageInfoV2"
        default:
          $ref: "#/components/responses/Error"
  /packages/{namespace}/{name}/versions:
    get:
      operationId: "listVersions"
      tags:
        - "packages"
      summary: "Versions of a package, newest first."
      description: "Includes yanked and tombstoned versions, with their state."
      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: "One page of versions."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionList"
        default:
          $ref: "#/components/responses/Error"
  /packages/{namespace}/{name}/{version}:
    get:
      operationId: "getVersion"
      tags:
        - "packages"
      summary: "One version of a package."
      description: |
        A yanked version is returned with `state: yanked` and its reason. A
        tombstoned version is returned with `state: tombstoned`, the reason
        code and the sha256 of each file, but no `url`.
      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Version"
      responses:
        "200":
          description: "The version."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionDetail"
        default:
          $ref: "#/components/responses/Error"
  /packages/{namespace}/{name}/{version}/files:
    post:
      operationId: "beginUpload"
      tags:
        - "publish"
      summary: "Begin the upload of one file of a version."
      description: |
        Publishing is three steps: begin an upload per file (this call), PUT the
        bytes to the returned URL with the returned headers, then commit
        (`commitPublish`). The registry binds the upload to the caller, the
        name, the version, the sha256 and the size; the presigned URL carries a
        signed `x-amz-checksum-sha256` and an exact content length so the
        storage layer itself rejects any other bytes. The URL expires in at
        most five minutes.

        A file over the per-file limit is `payload_too_large` (413). A file
        that would take the package's live files (published and yanked
        versions; a takedown frees its bytes) over the 10 GB per-project limit
        is `limit_exceeded` (403), which is about the project, not the file:
        a smaller file may still fit.
      security:
        - publishToken: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Version"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeginUploadRequest"
      responses:
        "200":
          description: "Where and how to upload."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeginUploadResponse"
        default:
          $ref: "#/components/responses/Error"
  /packages/{namespace}/{name}/{version}/publish:
    post:
      operationId: "commitPublish"
      tags:
        - "publish"
      summary: "Commit uploaded files as a version."
      description: |
        Asynchronous. The registry answers 202 with a status URL; the CLI
        polls it. Each upload id is single use and must belong to the caller
        and to this name and version. Committing the same upload ids again
        while the version is still `pending` resumes the same publish. A
        version that exists in any other state is refused with
        `version_exists`, whose message carries the sha256 already published;
        a client that wants "succeed if these exact bytes are already
        published" compares that sha256 with its own (or reads `getVersion`).
        The file set of a version is fixed at commit.

        The optional display fields (`description`, `license`, `repository`,
        `homepage`, `keywords`, `readme`) are checked here, stored on the
        version when it is published and served back by `getVersion`. A value
        that breaks its rule is `invalid_request`. A client that sends none gets
        a version without them, as before.

        The optional `source_commit` is the git commit id the version was built
        from (40 or 64 lowercase hex digits). It is stored once with the version,
        returned by `getVersion` as `source_commit`, and left out for a version
        committed without one. The registry only checks its form: it is not verified
        against the archives or the caller, and versions are never compared or
        ordered by it.
      security:
        - publishToken: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Version"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitPublishRequest"
      responses:
        "202":
          description: "The publish was accepted and is being processed."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitPublishResponse"
        default:
          $ref: "#/components/responses/Error"
  /publishes/{publish_id}:
    get:
      operationId: "getPublishStatus"
      tags:
        - "publish"
      summary: "Status of a publish."
      description: |
        `pending`, `validating` and `indexing` are in progress; `published` and
        `rejected` are final. A rejected publish burns the version number.
        A publish that passed can still carry `warnings`.
      security:
        - publishToken: []
      parameters:
        - $ref: "#/components/parameters/PublishId"
      responses:
        "200":
          description: "The current status."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishStatus"
        default:
          $ref: "#/components/responses/Error"
  /groups:
    post:
      operationId: "createGroup"
      tags:
        - "publish"
      summary: "Declare a set of versions to publish together."
      description: |
        A group is a set of versions, at most one per package, that are meant to be published together. This call
        declares the whole set up front (each member's name, version and files with their sha256 and size) and
        reserves the version numbers; the caller then PUTs each file to the URL it is given. Creating a group
        publishes nothing and makes nothing visible.

        The token must be an API token with the `publish` or `stage` scope for every member's package, and the caller must be
        able to write the namespace of each package; or a CI identity token minted by `exchangeOidcToken` for a publisher of the
        namespace, which must name every member's package and version. The first member
        that fails any of these refuses the whole group and is named in the error. A number that a published version
        already holds is `version_exists`; one that another group is still using is `group_conflict`. A
        `group_conflict` carries a `reason` (see `Error`) that tells the causes apart without reading the message.

        The id of a group is a function of the caller and the declared set: the same request again is the same group. The
        derivation is a stable interface, so a client can compute the id itself and read the group with `getGroup` (a 404
        `group_not_found` means there is no such group of the caller's). The id is `grp_` followed by the first 32 lowercase hex
        digits of the SHA-256 of the UTF-8 bytes of the compact JSON text (no white space) of the array
        `[actor, set]`. `actor` is `u:<GitHub account id>` for an account's token, including a CI token that acts for an
        account, and `ci:gh-repo:<repository id>` for a configured CI publisher's own token. `set` is the array of members
        sorted by full name, each member `[name, version, files]`, with `files` the array of the member's files sorted by
        the text `<subdir>/<filename>`, each file `[subdir, filename, sha256, size]` (`size` a JSON integer). The order of
        members and files in the request, `on_overlap`, a member's `readme` and every other option are not part of it. For the actor `u:1234` and
        the one file `linux-64/mojo-komira-ai.alpha-1.0.0-mojo1.0.0_0.conda` (sha256 `a` repeated 64 times, size 1000) of
        `komira-ai/alpha` 1.0.0, the text hashed is
        `["u:1234",[["komira-ai/alpha","1.0.0",[["linux-64","mojo-komira-ai.alpha-1.0.0-mojo1.0.0_0.conda","aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",1000]]]]]`
        and the id is `grp_598a7e4a7e56109c58051a434f3be338`. More vectors are in the registry's test fixtures. A change to the
        derivation would be a new id prefix, never a different hash under `grp_`. The hosted registry derives ids this way; the
        fake registry's ids are opaque and a client must not compute them.

        Repeating the request while the group is `open` returns `200` and continues it (a reply with `reserving` has not
        reached every member yet; send the same request again), with fresh upload URLs for the files not yet in
        storage. Repeating it for a group that ended without committing (`expired`, `aborted`, `rejected`,
        `superseded`) opens it again with the next `attempt` (`201`). A group that is `validating`, `committed` or
        `visible` is returned as it is. A `failed` group has burned its numbers: `group_conflict`.

        A caller has a limited number of open groups. A different set that shares a version with one of the caller's
        own open groups supersedes it; a group that is validating is never superseded. With `on_overlap: refuse` it is
        refused instead (`group_conflict`, reason `overlap_refused`) and nothing is ended. The groups a create ended are
        listed in `superseded` of its answer. A group that is past its
        `deadline_at` is expired by the next request that meets it. A group costs its number of files from a daily
        allowance of its own, once per attempt, which is not the allowance of single publishes.

        A registry that lists `group_readme_objects` in the `features` of `getHealth` also takes a `readme` on a member: the
        SHA-256 and size of the member's readme. It answers, for such a member, where to PUT the readme (`readme` of the
        member's answer, see `GroupUploadReadme`), and `commitGroup` then names the readme by that digest and size instead of
        carrying its text. A `readme` that is not `{sha256, size}` of a readme of 1 to 65536 bytes is `invalid_request`, and
        the message names the member. A registry that does not list the feature ignores the field and answers none.

        Group publishing is off unless the registry has enabled it for the caller. Until then this call is answered
        `route_not_found`; reading and aborting a group that exists keep working.
      security:
        - stageToken: []
        - publishToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: "The group was created, or opened again with the next attempt."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateGroupResponse"
        "200":
          description: "The group already existed: continued if it is open, otherwise as it is."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateGroupResponse"
        default:
          $ref: "#/components/responses/Error"
  /groups/{group_id}:
    get:
      operationId: "getGroup"
      tags:
        - "publish"
      summary: "Status of a group."
      description: |
        The group's status, attempt and deadline, and the state of each member: `pending` (its number is not reserved
        yet), `reserved`, `staged`, `published` or `yanked`. Each member also lists its `files`: the facts the caller declared at
        `createGroup`, and, while the group is `open`, whether each file is in storage. The read reserves and charges nothing (it only
        expires a group past its deadline), so it is the way to see a group, whatever its status, without `createGroup` (which reopens a group that ended).
        Needs a token with `stage` or `publish`. Readable by the caller who created the group and by an account that can write the namespace of every
        package in it; anyone else gets `group_not_found`. A group past its deadline that was still open is expired
        by this read.
      security:
        - stageToken: []
        - publishToken: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: "The current status."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: "abortGroup"
      tags:
        - "publish"
      summary: "Abort an open group."
      description: |
        Ends a group that is `open`. Its reserved version numbers are free again: another group, or a single publish,
        may take them. Repeating the call on an aborted group is a no-op and returns 200. A group in any other state
        (`validating`, `committed`, `expired`, ...) is `group_not_open`. Allowed for the same callers as `getGroup`: a token with `stage` or `publish`.
      security:
        - stageToken: []
        - publishToken: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: "The group, aborted."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
  /groups/{group_id}/commit:
    post:
      operationId: "commitGroup"
      tags:
        - "publish"
      summary: "Say that a group's files are uploaded and ask for the group to be validated and committed."
      description: |
        Asynchronous. The caller has created the group and PUT every file to the URL it was given; this call hands over what
        the archives cannot say for themselves, one entry per member: the optional `manifest_sha256` of its embedded manifest (checked when given, as in
        `commitPublish`), the optional display fields (the same rules as `commitPublish`) and the optional `source_commit` (the
        same rules, informational and unverified; it lands on that member's version only). Every member of the group is listed exactly once.

        The registry checks that the group is `open`, not past its `deadline_at`, that every member is reserved and that every
        file is in storage at its declared size, stores the request, moves the group to `validating` and answers 202. It then
        validates every member's archives; if every one is valid it copies the files into the channel and commits the group:
        the members become visible together to the read API, as `published` at the commit time. A member whose archive is not
        valid, a deadline that passes, or an upload more than 18 hours old ends the group `rejected` before anything is copied
        (its version numbers are free again); a failure after the copies began ends it `failed`, and its version numbers are
        burned. Read `getGroup` for where it is: `status` and, for a group that ended, `failure`.

        The same request again resumes: while the group is `validating` it queues the validation again (one job), and for a
        group that has committed it answers `200` as it is. A different request for a group that already has one is refused.
        A group that is not open (`aborted`, `expired`, `rejected`, ...) is refused with `group_commit_refused`; create it
        again with the same request to open it again. A commit is a write: read-only mode refuses it. It is not gated by the
        switch that enables group creation, since a group that exists is finished whatever the switch says.

        The token must have the `publish` scope (or, for a CI identity token, be the `publish` token of the exchange). A token with
        only `stage` is refused as `scope_missing`, and the group stays as it was.

        A member's `readme` is either the text (a string) or, at a registry that lists `group_readme_objects` in the
        `features` of `getHealth`, the `{sha256, size}` of a readme the caller has PUT to the URL `createGroup` gave. With
        text, the request is one body that holds the display fields of every member (a readme is up to 64 KiB), so a group
        of many members with readmes can exceed what the gateway accepts. With the object form the body holds a digest and a
        size for each readme (under 100 bytes), so its size does not depend on the readmes and a group of up to 500
        members stays far below any limit of the gateway.
      security:
        - publishToken: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitGroupRequest"
      responses:
        "202":
          description: "The group is validating; its validation is queued."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitGroupResponse"
        "200":
          description: "The group had already committed; it is returned as it is."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitGroupResponse"
        default:
          $ref: "#/components/responses/Error"
  /groups/{group_id}/yank:
    put:
      operationId: "yankGroup"
      tags:
        - "publish"
      summary: "Yank or unyank every version a group published."
      description: |
        The body is that of `setYanked`. `yanked: true` yanks the group's versions that are `published`; `yanked: false` restores
        exactly the versions that yank changed. Allowed for an account that can write the namespace of every package in it now, whether or not it created the
        group (a token outlives a membership change; an account that has lost the right is refused with `not_namespace_member`), with a token
        that has the `yank` or `publish` scope for every member (read-only mode refuses it).

        Only a group that is `visible` can be yanked or unyanked; a group that has not committed, or whose files are still being
        released after the commit, is refused with `group_not_settled`, as is a yank while an unyank of the group is running and the
        other way round. Asynchronous: the request records the intent, answers 202 and returns the group; the versions are yanked
        (or restored) by a job, then repodata and the sparse index follow, and the group's `yank.state` reaches `yanked` (or
        `restored`) when they are written. A version somebody yanked by hand before the group's yank stays yanked, and is not
        restored by the group's unyank. The same request again while the yank or unyank runs answers 202 as it is; a group already as
        asked (yanked and `yanked: true`, or never yanked or restored and `yanked: false`) answers 200 as it is.
      security:
        - yankToken: []
        - publishToken: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YankRequest"
      responses:
        "202":
          description: "The yank or unyank is running."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "200":
          description: "The group is already as asked."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
  /packages/{namespace}/{name}/{version}/yank:
    put:
      operationId: "setYanked"
      tags:
        - "publish"
      summary: "Yank or unyank a version."
      description: |
        `yanked: true` hides the version from new resolution; its files stay
        downloadable at their exact URLs, so existing locks keep working.
        `yanked: false` restores it. Allowed for an account that can write the
        namespace, or a token with the `yank` or `publish` scope for the package. Repeating the same change
        is a no-op and returns 200. A change the version's state does not
        allow is refused with `invalid_transition` (409): yanking a version
        that is still pending or is tombstoned, unyanking a version that is
        not yanked, or any change to a tombstoned version. A tombstoned
        version (taken down by an administrator) never changes state.
      security:
        - yankToken: []
        - publishToken: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Version"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YankRequest"
      responses:
        "200":
          description: "The version after the change."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionSummary"
        "409":
          description: "`invalid_transition`: the version's state does not allow this change."
          headers:
            x-mopm-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    userToken:
      type: "http"
      scheme: "bearer"
      bearerFormat: "mopm token"
      description: "Any live token of a user: a session token or an API token (but `createPackage` refuses an API token that has only the `stage` scope)."
    freshSession:
      type: "http"
      scheme: "bearer"
      bearerFormat: "mopm session token"
      description: |
        A session token younger than 15 minutes (login again to refresh). An
        older session, or an API token, gets `stale_session`. Used for creating
        a namespace and for token management.
    publishToken:
      type: "http"
      scheme: "bearer"
      bearerFormat: "mopm token"
      description: |
        An API token with the `publish` scope for the package (its full name), or a token from
        the OIDC exchange for exactly this package and version.
    yankToken:
      type: "http"
      scheme: "bearer"
      bearerFormat: "mopm token"
      description: "An API token with the `yank` scope for the package (its full name)."
    stageToken:
      type: "http"
      scheme: "bearer"
      bearerFormat: "mopm token"
      description: |
        An API token with the `stage` scope for the package, or a token from the OIDC exchange with `purpose: stage`
        for exactly this package and version. Accepted only where an operation lists it (`createGroup`, `getGroup`,
        `abortGroup`); `publishToken` is accepted there too. No other operation takes it: a commit needs `publishToken`
        and a yank needs `yankToken` or `publishToken`.
  headers:
    RequestId:
      description: "Identifies the request in the registry's logs. Print it with every error."
      required: true
      schema:
        type: "string"
        minLength: 1
    RetryAfter:
      description: "Seconds to wait before retrying. Present on `rate_limited` and `read_only_mode`."
      schema:
        type: "integer"
        minimum: 0
  responses:
    Error:
      description: |
        Any error. The `code` is stable (see `x-mopm-errors`); the HTTP status
        is the one the catalogue lists for that code.
      headers:
        x-mopm-request-id:
          $ref: "#/components/headers/RequestId"
        retry-after:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    TokenId:
      name: "token_id"
      in: "path"
      required: true
      schema:
        type: "string"
        minLength: 1
        maxLength: 64
    Namespace:
      name: "namespace"
      in: "path"
      required: true
      description: "The namespace of the package, a GitHub login in lower case."
      schema:
        $ref: "#/components/schemas/Namespace"
    User:
      name: "user"
      in: "path"
      required: true
      description: "A mopm username, the user namespace of an account (its GitHub login in lower case)."
      schema:
        $ref: "#/components/schemas/Namespace"
    Query:
      name: "q"
      in: "query"
      required: false
      description: "A name prefix, or `<namespace>/` with an optional name prefix; normalised before matching."
      schema:
        type: "string"
        maxLength: 104
    Sort:
      name: "sort"
      in: "query"
      required: false
      schema:
        type: "string"
        enum:
          - "name"
          - "updated"
        default: "name"
    Cursor:
      name: "cursor"
      in: "query"
      required: false
      description: "Opaque. Pass the `next_cursor` of the previous page."
      schema:
        type: "string"
        minLength: 1
        maxLength: 512
    Limit:
      name: "limit"
      in: "query"
      required: false
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 20
    Name:
      name: "name"
      in: "path"
      required: true
      description: "Normalised package name, the part of the full name after the `/`."
      schema:
        $ref: "#/components/schemas/Name"
    Version:
      name: "version"
      in: "path"
      required: true
      schema:
        $ref: "#/components/schemas/Version"
    PublishId:
      name: "publish_id"
      in: "path"
      required: true
      schema:
        type: "string"
        minLength: 1
        maxLength: 64
    GroupId:
      name: "group_id"
      in: "path"
      required: true
      schema:
        type: "string"
        pattern: "^grp_[0-9a-f]{32}$"
  schemas:
    Namespace:
      description: |
        A namespace: a GitHub login in lower case, letters, digits and single hyphens, at most 39 characters. Nothing
        normalises it; a reader checks the length as well as the pattern.
      type: "string"
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      minLength: 1
      maxLength: 39
    Name:
      description: "A normalised package name; in a full name, the import name."
      type: "string"
      pattern: "^[a-z][a-z0-9_]{1,63}$"
    FullName:
      description: |
        `<namespace>/<name>`, the name of a package: a `Namespace`, one `/` and a `Name`. The conda name of the package is
        `mojo-<namespace>.<name>`.
      type: "string"
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*/[a-z][a-z0-9_]{1,63}$"
      maxLength: 104
    Version:
      description: |
        A version: `MAJOR.MINOR.PATCH`, exactly three numbers separated by
        dots, each without leading zeros. There are no pre-release, post-release,
        dev or local versions and no shorter or longer spellings (`1.0`,
        `1.0.0.0`, `1.0.0-rc.1`, `1.0rc1` are all invalid), so a version has one
        spelling and two versions are equal exactly when their text is. Anything
        else is `invalid_version`.
      type: "string"
      pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"
    Sha256:
      type: "string"
      pattern: "^[0-9a-f]{64}$"
    SourceCommit:
      description: |
        A git commit id: exactly 40 (SHA-1) or 64 (SHA-256) lowercase hex digits. The publisher states it when it commits a version
        (`commitPublish`, `commitGroup`); the registry stores it once with the version and serves it back from `getVersion`. It is
        informational: the registry does not verify it against the archives, the repository or the caller's identity, and it never
        compares or orders versions by it. Anything else (uppercase, another length, a non-hex character, a value that is not a
        string) is `invalid_request`.
      type: "string"
      pattern: "^([0-9a-f]{40}|[0-9a-f]{64})$"
    Subdir:
      description: "A conda subdir. New values may be added."
      type: "string"
      enum:
        - "linux-64"
        - "linux-aarch64"
        - "osx-arm64"
        - "noarch"
    Filename:
      description: "The conda file name, `mojo-<namespace>.<name>-<version>-<build>.conda`."
      type: "string"
      pattern: "^mojo-[a-z0-9]+(-[a-z0-9]+)*\\.[a-z][a-z0-9_]{1,63}-[0-9][0-9a-z.]*-[A-Za-z0-9_.]+\\.conda$"
    Timestamp:
      type: "string"
      format: "date-time"
    Token:
      description: "A bearer token. Shown once, at creation."
      type: "string"
      pattern: "^mopm_[a-z2-7]{32,64}$"
    VersionState:
      description: |
        `published`: resolvable. `yanked`: hidden from new resolution, bytes
        stay. `tombstoned`: bytes removed by an administrator; the number stays
        burned. Clients treat an unknown state as not resolvable.
      type: "string"
      enum:
        - "published"
        - "yanked"
        - "tombstoned"
    FileRef:
      type: "object"
      required:
        - "subdir"
        - "filename"
        - "sha256"
        - "size"
      properties:
        subdir:
          $ref: "#/components/schemas/Subdir"
        filename:
          $ref: "#/components/schemas/Filename"
        sha256:
          $ref: "#/components/schemas/Sha256"
        size:
          type: "integer"
          minimum: 1
        url:
          description: "Absolute URL on the channel host. Absent when the version is tombstoned."
          type: "string"
          format: "uri"
    Dep:
      type: "object"
      required:
        - "name"
      properties:
        name:
          $ref: "#/components/schemas/FullName"
        range:
          type: "string"
    NativeRef:
      type: "object"
      required:
        - "id"
        - "soname"
      properties:
        id:
          type: "string"
          minLength: 1
        soname:
          type: "string"
          minLength: 1
    Keywords:
      description: "Free-form tags from `keywords` in mopm.toml, at most 10, each 1 to 32 characters (see spec/mopm-toml.md)."
      type: "array"
      maxItems: 10
      uniqueItems: true
      items:
        type: "string"
        minLength: 1
        maxLength: 32
    GroupId:
      type: "string"
      pattern: "^grp_[0-9a-f]{32}$"
    Error:
      type: "object"
      required:
        - "error"
      properties:
        error:
          type: "object"
          required:
            - "code"
            - "message"
            - "hint"
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: "string"
              minLength: 1
            hint:
              type: "string"
            reason:
              description: |
                Why the request was refused, for a code that lists reasons (`x-mopm-error-reasons`; today only
                `group_conflict`). Absent for every other code and may be absent for a listed one. A client MUST treat a
                reason it does not know like an absent one, and must not parse `message` to learn it. It never holds an id
                or anything of another account, and it is not part of the message.
              type: "string"
              enum:
                - "number_held"
                - "group_failed"
                - "open_cap"
                - "supersede_cap"
                - "takeover_blocked"
                - "number_taken"
                - "overlap_refused"
    ErrorCode:
      description: |
        Stable machine-readable error codes. A client MUST treat a code it does
        not know as the generic failure of the HTTP status class.
      type: "string"
      enum:
        - "invalid_request"
        - "invalid_name"
        - "invalid_version"
        - "upload_invalid"
        - "token_missing"
        - "token_unknown"
        - "token_expired"
        - "token_revoked"
        - "stale_session"
        - "oidc_token_invalid"
        - "scope_missing"
        - "not_owner"
        - "name_reserved"
        - "oidc_not_trusted"
        - "limit_exceeded"
        - "package_not_found"
        - "version_not_found"
        - "device_code_unknown"
        - "token_not_found"
        - "publish_not_found"
        - "group_not_found"
        - "version_exists"
        - "upload_used"
        - "group_not_open"
        - "group_conflict"
        - "group_commit_refused"
        - "group_not_settled"
        - "invalid_transition"
        - "payload_too_large"
        - "rate_limited"
        - "internal_error"
        - "read_only_mode"
        - "unavailable"
        - "route_not_found"
        - "invalid_namespace"
        - "not_namespace_member"
        - "namespace_reserved"
        - "namespace_not_found"
        - "namespace_taken"
        - "not_org_admin"
        - "github_account_mismatch"
        - "not_namespace_owner"
        - "last_owner"
        - "member_not_found"
        - "user_not_found"
    RejectionCode:
      description: |
        Why a publish was rejected after it was accepted (`PublishStatus`).
        Not an HTTP error. Clients treat an unknown value as a generic rejection.
      type: "string"
      enum:
        - "archive_invalid"
        - "path_not_allowed"
        - "limit_exceeded"
        - "manifest_invalid"
        - "filename_mismatch"
        - "sha256_mismatch"
        - "dependency_not_allowed"
    Health:
      type: "object"
      required:
        - "status"
        - "stage"
        - "api_version"
        - "read_only"
      properties:
        status:
          type: "string"
          enum:
            - "ok"
        stage:
          type: "string"
          enum:
            - "beta"
            - "gamma"
            - "prod"
        api_version:
          description: "`v2` at `/api/v2`, `v1` at `/api/v1`."
          type: "string"
          enum:
            - "v1"
            - "v2"
        read_only:
          type: "boolean"
        impl:
          description: |
            Which implementation of the registry answered: `ts` or `rust`. Additive: a
            client that does not know it ignores it, and a server may omit it.
          type: "string"
          enum:
            - "ts"
            - "rust"
        features:
          description: |
            The optional features this registry serves, by name. Additive: a client treats a name it does not know as absent,
            and a missing list as empty, so a registry from before the list answers none. One name is defined:
            `group_readme_objects`, which says that `createGroup` takes `readme` on a member and answers where to PUT it,
            and that `commitGroup` takes a readme as `{sha256, size}` (see `ReadmeRef`).
          type: "array"
          items:
            type: "string"
    DeviceStartRequest:
      type: "object"
      required:
        - "client"
      properties:
        client:
          description: "Shown on the approval page, e.g. `mopm 0.1.0`."
          type: "string"
          minLength: 1
          maxLength: 80
    DeviceStartResponse:
      type: "object"
      required:
        - "device_code"
        - "user_code"
        - "verification_uri"
        - "expires_in"
        - "interval"
      properties:
        device_code:
          type: "string"
          minLength: 16
        user_code:
          type: "string"
          minLength: 4
        verification_uri:
          type: "string"
          format: "uri"
        expires_in:
          description: "Seconds. Ten minutes."
          type: "integer"
          minimum: 1
        interval:
          description: "Minimum seconds between polls."
          type: "integer"
          minimum: 1
    DevicePollRequest:
      type: "object"
      required:
        - "device_code"
      properties:
        device_code:
          type: "string"
          minLength: 16
    DevicePollResponse:
      type: "object"
      required:
        - "status"
      properties:
        status:
          type: "string"
          enum:
            - "pending"
            - "approved"
            - "denied"
            - "expired"
        interval:
          type: "integer"
          minimum: 1
        token:
          $ref: "#/components/schemas/Token"
        token_kind:
          type: "string"
          enum:
            - "session"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        fresh_until:
          $ref: "#/components/schemas/Timestamp"
        handle:
          type: "string"
          minLength: 1
        namespace:
          description: "The user namespace of the account that approved (its login in lower case), when the login made it or found it. Absent when the login cannot be a namespace (see `MeV2.unavailable_namespace`)."
          $ref: "#/components/schemas/Namespace"
      if:
        properties:
          status:
            const: "approved"
      then:
        required:
          - "token"
          - "token_kind"
          - "expires_at"
          - "fresh_until"
          - "handle"
    OidcExchangeRequest:
      description: |
        Two forms. `name` and `version`: a token for that one package version. `packages`: one token for every
        listed package version, all of one namespace. Every name is a full name, and the CI identity must match a trusted
        publisher of its namespace; the call creates no package. Send one form, not both; a name is listed once. Either
        form takes the optional `purpose`.
      type: "object"
      required:
        - "jwt"
      oneOf:
        - required:
            - "name"
            - "version"
        - required:
            - "packages"
      properties:
        jwt:
          type: "string"
          minLength: 1
        purpose:
          description: "What the token is for. `publish` is the default; `stage` mints a token that cannot commit or yank."
          type: "string"
          enum:
            - "publish"
            - "stage"
        name:
          $ref: "#/components/schemas/FullName"
        version:
          $ref: "#/components/schemas/Version"
        packages:
          type: "array"
          minItems: 1
          maxItems: 500
          items:
            type: "object"
            required:
              - "name"
              - "version"
            properties:
              name:
                $ref: "#/components/schemas/FullName"
              version:
                $ref: "#/components/schemas/Version"
    OidcExchangeResponse:
      description: |
        `name` and `version` answer the single-package form, `packages` the list form. Exactly one
        of the two, as the request is.
      type: "object"
      required:
        - "token"
        - "token_kind"
        - "expires_at"
      oneOf:
        - required:
            - "name"
            - "version"
        - required:
            - "packages"
      properties:
        token:
          $ref: "#/components/schemas/Token"
        token_kind:
          type: "string"
          enum:
            - "publish"
            - "stage"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        name:
          $ref: "#/components/schemas/FullName"
        version:
          $ref: "#/components/schemas/Version"
        packages:
          type: "array"
          items:
            type: "object"
            required:
              - "name"
              - "version"
            properties:
              name:
                $ref: "#/components/schemas/FullName"
              version:
                $ref: "#/components/schemas/Version"
    TokenScope:
      description: |
        `publish` creates, uploads, reads, aborts and commits groups and publishes single versions; it may also yank.
        `yank` yanks. `stage` prepares a group (create, read, abort) and nothing else: it cannot commit a group, publish a
        single version, yank or create a package, and it is not enough alone where `publish` or `yank` is asked for.
      type: "string"
      enum:
        - "publish"
        - "yank"
        - "stage"
    TokenPackages:
      description: "An explicit list of full names, or the string `all_current`."
      oneOf:
        - type: "array"
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/FullName"
        - type: "string"
          const: "all_current"
    CreateTokenRequest:
      type: "object"
      required:
        - "name"
        - "scopes"
        - "packages"
        - "expires_in_days"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 80
        scopes:
          type: "array"
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TokenScope"
        packages:
          $ref: "#/components/schemas/TokenPackages"
        expires_in_days:
          type: "integer"
          minimum: 1
          maximum: 90
    CreateTokenResponse:
      type: "object"
      required:
        - "id"
        - "name"
        - "token"
        - "scopes"
        - "packages"
        - "expires_at"
      properties:
        id:
          type: "string"
          minLength: 1
        name:
          type: "string"
        token:
          $ref: "#/components/schemas/Token"
        scopes:
          type: "array"
          items:
            $ref: "#/components/schemas/TokenScope"
        packages:
          $ref: "#/components/schemas/TokenPackages"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
    TokenMeta:
      type: "object"
      required:
        - "id"
        - "name"
        - "scopes"
        - "packages"
        - "created_at"
        - "expires_at"
      properties:
        id:
          type: "string"
          minLength: 1
        name:
          type: "string"
        scopes:
          type: "array"
          items:
            $ref: "#/components/schemas/TokenScope"
        packages:
          $ref: "#/components/schemas/TokenPackages"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    TokenList:
      type: "object"
      required:
        - "tokens"
      properties:
        tokens:
          type: "array"
          items:
            $ref: "#/components/schemas/TokenMeta"
    PackageSummary:
      type: "object"
      required:
        - "name"
        - "latest"
        - "description"
        - "updated_at"
      properties:
        name:
          $ref: "#/components/schemas/FullName"
        latest:
          description: "Newest published (not yanked) version, or null."
          oneOf:
            - $ref: "#/components/schemas/Version"
            - type: "null"
        description:
          type:
            - "string"
            - "null"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    PackageList:
      type: "object"
      required:
        - "packages"
        - "next_cursor"
      properties:
        packages:
          type: "array"
          items:
            $ref: "#/components/schemas/PackageSummary"
        next_cursor:
          type:
            - "string"
            - "null"
    VersionSummary:
      type: "object"
      required:
        - "version"
        - "state"
        - "published_at"
      properties:
        version:
          $ref: "#/components/schemas/Version"
        state:
          $ref: "#/components/schemas/VersionState"
        published_at:
          $ref: "#/components/schemas/Timestamp"
        yank_reason:
          type:
            - "string"
            - "null"
    VersionList:
      type: "object"
      required:
        - "versions"
        - "next_cursor"
      properties:
        versions:
          type: "array"
          items:
            $ref: "#/components/schemas/VersionSummary"
        next_cursor:
          type:
            - "string"
            - "null"
    Provenance:
      type: "object"
      required:
        - "kind"
      properties:
        kind:
          type: "string"
          enum:
            - "none"
            - "oidc"
        repository:
          type: "string"
        workflow_ref:
          type: "string"
    Tombstone:
      type: "object"
      required:
        - "reason_code"
        - "date"
      properties:
        reason_code:
          type: "string"
          minLength: 1
        date:
          type: "string"
          format: "date"
    VersionDetail:
      type: "object"
      required:
        - "name"
        - "version"
        - "state"
        - "published_at"
        - "requires_mojo"
        - "deps"
        - "native"
        - "files"
        - "manifest_sha256"
        - "provenance"
      properties:
        name:
          $ref: "#/components/schemas/FullName"
        version:
          $ref: "#/components/schemas/Version"
        state:
          $ref: "#/components/schemas/VersionState"
        yank_reason:
          type:
            - "string"
            - "null"
        tombstone:
          $ref: "#/components/schemas/Tombstone"
        published_at:
          $ref: "#/components/schemas/Timestamp"
        published_by:
          type: "string"
        requires_mojo:
          description: "The conda requirement on the compiler, e.g. `==1.0.0`."
          type: "string"
          minLength: 1
        deps:
          type: "array"
          items:
            $ref: "#/components/schemas/Dep"
        native:
          type: "array"
          items:
            $ref: "#/components/schemas/NativeRef"
        files:
          type: "array"
          minItems: 1
          items:
            $ref: "#/components/schemas/FileRef"
        manifest_sha256:
          $ref: "#/components/schemas/Sha256"
        group_id:
          description: |
            The group (`createGroup`) that published this version. Absent for a version a single publish made, and for a version
            published before the registry recorded it. It can be used with `getGroup` and `yankGroup`, which keep their own
            ownership and scope rules: knowing it grants nothing. A version that is still `pending` is not found, whatever its group.
          $ref: "#/components/schemas/GroupId"
        source_commit:
          description: |
            The git commit the publisher said the version was built from, as sent when it was committed. Absent for a version
            committed without one, including every version published before the registry recorded it. Informational and unverified:
            the registry checks its form only, so it is not proof of where the files came from.
          $ref: "#/components/schemas/SourceCommit"
        description:
          description: "`[package] description` of this version's mopm.toml. Absent when not set."
          type: "string"
          maxLength: 512
        license:
          description: "`[package] license`, an SPDX expression. Absent when not set."
          type: "string"
          maxLength: 128
        repository:
          description: "An https URL. Absent when not set."
          type: "string"
          format: "uri"
          maxLength: 2048
        homepage:
          description: "An https URL. Absent when not set. Untrusted input, so check the scheme before linking it."
          type: "string"
          format: "uri"
          maxLength: 2048
        keywords:
          $ref: "#/components/schemas/Keywords"
        readme:
          description: |
            Markdown, at most 64 KiB (65,536 bytes of UTF-8), from the file `[package] readme` names. Untrusted Markdown written by the
            publisher: a consumer must sanitize it, disable raw HTML and treat every link as untrusted. `description`
            and `license` are untrusted plain text: escape them, never render them as markup. Render it as untrusted text. Absent when the version has none. The five fields above and this one are copied from
            mopm.toml by the publish pipeline when it publishes a version; versions published before that carry none
            of them. All are additive and optional, so older clients ignore them.
          type: "string"
          maxLength: 65536
        readme_html:
          description: "Sanitised HTML. Never trust it on a cookie-authenticated origin."
          type:
            - "string"
            - "null"
        provenance:
          $ref: "#/components/schemas/Provenance"
    CreateNamespaceRequest:
      type: "object"
      required:
        - "namespace"
      properties:
        namespace:
          $ref: "#/components/schemas/Namespace"
    NamespaceInfo:
      type: "object"
      required:
        - "namespace"
        - "kind"
        - "github_id"
        - "login"
      properties:
        namespace:
          $ref: "#/components/schemas/Namespace"
        kind:
          type: "string"
          enum:
            - "user"
            - "org"
        github_id:
          type: "integer"
          minimum: 1
        login:
          description: "A user namespace: the GitHub login of the account as of its last login, which differs from namespace after a rename. An organization namespace: the namespace."
          type: "string"
          minLength: 1
    NamespacePollResponse:
      type: "object"
      required:
        - "status"
      properties:
        status:
          type: "string"
          enum:
            - "pending"
            - "created"
            - "denied"
            - "expired"
        interval:
          type: "integer"
          minimum: 1
        namespace:
          $ref: "#/components/schemas/NamespaceInfo"
      if:
        properties:
          status:
            const: "created"
      then:
        required:
          - "namespace"
    MemberRole:
      type: "string"
      enum:
        - "owner"
        - "member"
    Member:
      type: "object"
      required:
        - "user"
        - "handle"
        - "github_id"
        - "role"
        - "added_at"
      properties:
        user:
          $ref: "#/components/schemas/Namespace"
        handle:
          description: "The GitHub login of the account at its last mopm login."
          type: "string"
          minLength: 1
        github_id:
          type: "integer"
          minimum: 1
        role:
          $ref: "#/components/schemas/MemberRole"
        added_at:
          description: "When the account was added or its role last changed."
          $ref: "#/components/schemas/Timestamp"
    MemberList:
      type: "object"
      required:
        - "namespace"
        - "members"
      properties:
        namespace:
          $ref: "#/components/schemas/Namespace"
        members:
          type: "array"
          items:
            $ref: "#/components/schemas/Member"
    SetMemberRequest:
      type: "object"
      required:
        - "role"
      properties:
        role:
          $ref: "#/components/schemas/MemberRole"
    MeV2:
      type: "object"
      required:
        - "github_id"
        - "handle"
        - "namespaces"
      properties:
        github_id:
          type: "integer"
          minimum: 1
        handle:
          type: "string"
          minLength: 1
        namespaces:
          type: "array"
          items:
            type: "object"
            required:
              - "namespace"
              - "kind"
              - "role"
              - "packages"
            properties:
              namespace:
                $ref: "#/components/schemas/Namespace"
              kind:
                type: "string"
                enum:
                  - "user"
                  - "org"
              role:
                description: "owner for a user namespace of the caller and for an organization namespace the caller owns; member for an organization namespace the caller is a member of."
                type: "string"
                enum:
                  - "owner"
                  - "member"
              packages:
                type: "array"
                items:
                  $ref: "#/components/schemas/FullName"
        unavailable_namespace:
          description: "The caller's GitHub login when it cannot be the caller's namespace (another account holds it, it is reserved, or it is outside the grammar). Absent otherwise."
          type: "string"
    PackageInfoV2:
      type: "object"
      required:
        - "name"
        - "state"
        - "namespace"
        - "latest"
        - "repository"
        - "license"
        - "description"
        - "created_at"
        - "versions"
      properties:
        name:
          $ref: "#/components/schemas/FullName"
        display_name:
          type: "string"
        state:
          description: "`claimed` until the first version is published, `active` from then on. A package with no version does not expire."
          type: "string"
          enum:
            - "claimed"
            - "active"
        namespace:
          description: "The namespace the package belongs to. It is the package's owner; there are no package owners."
          $ref: "#/components/schemas/NamespaceInfo"
        latest:
          oneOf:
            - $ref: "#/components/schemas/Version"
            - type: "null"
        repository:
          description: "An https URL. Untrusted input."
          type:
            - "string"
            - "null"
        license:
          type:
            - "string"
            - "null"
        description:
          type:
            - "string"
            - "null"
        homepage:
          description: "An https URL, from mopm.toml. Absent when not set. Untrusted input, so check the scheme before linking it."
          type: "string"
          format: "uri"
          maxLength: 2048
        keywords:
          $ref: "#/components/schemas/Keywords"
        readme:
          description: "Markdown of the latest version's readme (see VersionDetail.readme). Untrusted Markdown, sanitize before rendering. Absent when it has none."
          type: "string"
          maxLength: 65536
        created_at:
          $ref: "#/components/schemas/Timestamp"
        versions:
          type: "array"
          items:
            $ref: "#/components/schemas/VersionSummary"
    BeginUploadRequest:
      type: "object"
      required:
        - "subdir"
        - "filename"
        - "sha256"
        - "size"
      properties:
        subdir:
          $ref: "#/components/schemas/Subdir"
        filename:
          $ref: "#/components/schemas/Filename"
        sha256:
          $ref: "#/components/schemas/Sha256"
        size:
          description: "Bytes. At most 100 MB (100,000,000 bytes)."
          type: "integer"
          minimum: 1
          maximum: 100000000
    BeginUploadResponse:
      type: "object"
      required:
        - "upload_id"
        - "put_url"
        - "put_headers"
        - "expires_at"
      properties:
        upload_id:
          type: "string"
          minLength: 1
        put_url:
          type: "string"
          format: "uri"
        put_headers:
          description: "Headers the client MUST send with the PUT, exactly as given."
          type: "object"
          additionalProperties:
            type: "string"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
    CommitPublishRequest:
      type: "object"
      required:
        - "upload_ids"
      properties:
        upload_ids:
          type: "array"
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: "string"
            minLength: 1
        manifest_sha256:
          description: |
            Optional. The SHA-256 of the bytes of `lib/mojo/<import name>.mopm.json` in the archives (what `mopm pack` prints). When given
            it is checked: a value that is not 64 lowercase hex digits is `invalid_request`, and an archive whose manifest hashes
            to something else is rejected `sha256_mismatch`. When absent, nothing is checked and the version holds the hash the
            registry computes from the archives; then every file of the version must carry the same manifest bytes, or the publish is
            rejected `manifest_invalid`. When given, a file whose manifest hashes to something else is `sha256_mismatch`, so at
            most the files that carry the given manifest bytes pass.
          $ref: "#/components/schemas/Sha256"
        source_commit:
          description: |
            Optional. The git commit the version was built from (see `SourceCommit`). Stored once with the version and served by
            `getVersion`; the registry does not verify it. Committing the same upload ids again must repeat it (or its absence): a
            repeat that states another value is refused `version_exists`, and the stored value does not change.
          $ref: "#/components/schemas/SourceCommit"
        description:
          description: "`[package] description` of this version's mopm.toml: one line, no line breaks. Stored on the version and served back by `getVersion`."
          type: "string"
          minLength: 1
          maxLength: 512
        license:
          description: "`[package] license`, an SPDX expression."
          type: "string"
          minLength: 1
          maxLength: 128
        repository:
          description: "An https URL."
          type: "string"
          format: "uri"
          maxLength: 2048
        homepage:
          description: "An https URL."
          type: "string"
          format: "uri"
          maxLength: 2048
        keywords:
          $ref: "#/components/schemas/Keywords"
        readme:
          description: |
            Untrusted Markdown, stored verbatim: the registry does not sanitize it, so a consumer must sanitize it,
            disable raw HTML and treat links as untrusted. Same for `description` and `license` (plain text).
            At most 64 KiB: 65,536 bytes of UTF-8 (the registry counts
            bytes, not characters, so non-ASCII text uses more of it). This is
            the cap the read API serves, so a larger readme is refused with
            `invalid_request` rather than stored and never shown. `maxLength`
            below is in characters and can only bound the byte count from
            above.
          type: "string"
          maxLength: 65536
    CommitPublishResponse:
      type: "object"
      required:
        - "publish_id"
        - "status_url"
      properties:
        publish_id:
          type: "string"
          minLength: 1
        status_url:
          description: "Path on the same host. GET it with the same token."
          type: "string"
          pattern: "^/api/v2/publishes/"
    PublishStatus:
      type: "object"
      required:
        - "publish_id"
        - "name"
        - "version"
        - "status"
      properties:
        publish_id:
          type: "string"
          minLength: 1
        name:
          $ref: "#/components/schemas/FullName"
        version:
          $ref: "#/components/schemas/Version"
        status:
          type: "string"
          enum:
            - "pending"
            - "validating"
            - "indexing"
            - "published"
            - "rejected"
        rejection_code:
          $ref: "#/components/schemas/RejectionCode"
        message:
          type: "string"
        warnings:
          description: |
            What did not stop the publish and the publisher should read: a native dependency whose name the registry's copy of
            conda-forge's package names does not list (a typo, or a package newer than the copy), a copy more than a day old,
            or a copy that could not be read. Present only once the validator has found something to say, and so may first
            appear on a `validating` or later status. Absent means nothing to report. A client prints these and goes on;
            a client built before this field ignores it.
          type: "array"
          items:
            type: "string"
      if:
        properties:
          status:
            const: "rejected"
      then:
        required:
          - "rejection_code"
    GroupFile:
      type: "object"
      required:
        - "subdir"
        - "filename"
        - "sha256"
        - "size"
      properties:
        subdir:
          $ref: "#/components/schemas/Subdir"
        filename:
          $ref: "#/components/schemas/Filename"
        sha256:
          $ref: "#/components/schemas/Sha256"
        size:
          description: "Bytes. At most 100 MB (100,000,000 bytes)."
          type: "integer"
          minimum: 1
          maximum: 100000000
    ReadmeRef:
      description: |
        A readme named by the SHA-256 of its bytes and their count, for a readme that travels as an uploaded object. At most
        64 KiB (65,536 bytes) of UTF-8.
      type: "object"
      required:
        - "sha256"
        - "size"
      properties:
        sha256:
          $ref: "#/components/schemas/Sha256"
        size:
          description: "Bytes, 1 to 65536."
          type: "integer"
          minimum: 1
          maximum: 65536
    GroupMemberRequest:
      type: "object"
      required:
        - "name"
        - "version"
        - "files"
      properties:
        name:
          $ref: "#/components/schemas/FullName"
        version:
          $ref: "#/components/schemas/Version"
        readme:
          description: |
            Optional, and taken only by a registry that lists `group_readme_objects` in the `features` of `getHealth`; any
            other ignores it. The readme of the member as an object to upload (see `ReadmeRef`). It is not part of the group
            id, so the same set with or without it is the same group. When it is given the answer's member carries `readme`
            (`GroupUploadReadme`) unless the answer is `reserving`.
          $ref: "#/components/schemas/ReadmeRef"
        files:
          type: "array"
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/GroupFile"
    CreateGroupRequest:
      type: "object"
      required:
        - "members"
      properties:
        members:
          description: "One member per package. The registry's limit on members is 500 by default."
          type: "array"
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/GroupMemberRequest"
        on_overlap:
          description: |
            What to do when the caller's own open groups share a version with this set. `supersede` (the default) ends
            them, as described under `createGroup`. `refuse` ends nothing: the call is answered `group_conflict` with the
            reason `overlap_refused`, and the message names the caller's own overlapping group ids. It is not part of
            the group id, so the same set with either value is the same group. A registry that predates this option
            ignores it and supersedes, and does not name what it ended in `superseded` either, so a client that must
            never supersede cannot rely on `refuse` against a registry it has not seen name them.
          type: "string"
          enum:
            - "supersede"
            - "refuse"
    GroupStatusName:
      description: "Where a group is. A client treats a value it does not know as \"unknown\"."
      type: "string"
      enum:
        - "open"
        - "validating"
        - "committed"
        - "visible"
        - "rejected"
        - "failed"
        - "expired"
        - "aborted"
        - "superseded"
    GroupUploadFile:
      type: "object"
      required:
        - "subdir"
        - "filename"
        - "upload_id"
        - "uploaded"
      properties:
        subdir:
          $ref: "#/components/schemas/Subdir"
        filename:
          $ref: "#/components/schemas/Filename"
        upload_id:
          type: "string"
          minLength: 1
        uploaded:
          description: "The bytes are already in storage; there is nothing to PUT."
          type: "boolean"
        put_url:
          description: "Present when `uploaded` is false."
          type: "string"
          format: "uri"
        put_headers:
          description: "Headers the client MUST send with the PUT, exactly as given. Present when `uploaded` is false."
          type: "object"
          additionalProperties:
            type: "string"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
    GroupUploadReadme:
      description: |
        Where to PUT the readme a member declared, with the same meaning as `GroupUploadFile`: `uploaded` is true when the
        object is in storage at the declared size, and then there is nothing to PUT; otherwise `put_url`, `put_headers` and
        `expires_at` are present, and the PUT is pinned to the declared SHA-256 and size.
      type: "object"
      required:
        - "sha256"
        - "size"
        - "upload_id"
        - "uploaded"
      properties:
        sha256:
          $ref: "#/components/schemas/Sha256"
        size:
          type: "integer"
          minimum: 1
          maximum: 65536
        upload_id:
          type: "string"
          minLength: 1
        uploaded:
          description: "The bytes are already in storage; there is nothing to PUT."
          type: "boolean"
        put_url:
          description: "Present when `uploaded` is false."
          type: "string"
          format: "uri"
        put_headers:
          description: "Headers the client MUST send with the PUT, exactly as given. Present when `uploaded` is false."
          type: "object"
          additionalProperties:
            type: "string"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
    GroupMemberAnswer:
      type: "object"
      required:
        - "name"
        - "version"
        - "action"
        - "files"
      properties:
        name:
          $ref: "#/components/schemas/FullName"
        version:
          $ref: "#/components/schemas/Version"
        action:
          description: |
            `new`: this call reserved the number. `join`: it was already reserved for the group, or was taken over from a
            reservation nobody used. `skip_identical`: the group has nothing more to do for this member.
          type: "string"
          enum:
            - "new"
            - "join"
            - "skip_identical"
        files:
          type: "array"
          items:
            $ref: "#/components/schemas/GroupUploadFile"
        readme:
          description: |
            Present when the member declared a `readme`, the registry lists `group_readme_objects`, and the answer carries
            the members' files (not on a `reserving` answer). A client that finds a declared readme without it treats the
            registry as one that does not take readme objects.
          $ref: "#/components/schemas/GroupUploadReadme"
    CreateGroupResponse:
      type: "object"
      required:
        - "group_id"
        - "status"
        - "attempt"
        - "deadline_at"
        - "members"
      properties:
        group_id:
          $ref: "#/components/schemas/GroupId"
        status:
          $ref: "#/components/schemas/GroupStatusName"
        attempt:
          description: "Starts at 1; a group that ended and was created again has the next one."
          type: "integer"
          minimum: 1
        superseded:
          description: |
            The ids of the caller's own groups this call ended as `superseded`, as the `group_supersede` audit rows record.
            Absent when it ended none, and on a later call that only continues the group.
          type: "array"
          minItems: 1
          items:
            $ref: "#/components/schemas/GroupId"
        deadline_at:
          $ref: "#/components/schemas/Timestamp"
        reserving:
          description: "Present when the call ran out of time before it reached every member; `members` holds the first `done`. Send the same request again."
          type: "object"
          required:
            - "done"
            - "total"
          properties:
            done:
              type: "integer"
              minimum: 0
            total:
              type: "integer"
              minimum: 1
        members:
          type: "array"
          items:
            $ref: "#/components/schemas/GroupMemberAnswer"
    CommitGroupMember:
      type: "object"
      required:
        - "name"
      properties:
        name:
          $ref: "#/components/schemas/FullName"
        manifest_sha256:
          description: "Optional, member by member, with the meaning it has in `CommitPublishRequest`. A repeated commit must repeat which members gave it and what they gave, or it is another request (`group_commit_refused`)."
          $ref: "#/components/schemas/Sha256"
        source_commit:
          description: "Optional, member by member, with the meaning it has in `CommitPublishRequest`. It is stored on that member's version only, and is part of the request a repeated commit must repeat."
          $ref: "#/components/schemas/SourceCommit"
        description:
          description: "As in `CommitPublishRequest`."
          type: "string"
          minLength: 1
          maxLength: 512
        license:
          description: "As in `CommitPublishRequest`."
          type: "string"
          minLength: 1
          maxLength: 128
        repository:
          description: "An https URL."
          type: "string"
          format: "uri"
          maxLength: 2048
        homepage:
          description: "An https URL."
          type: "string"
          format: "uri"
          maxLength: 2048
        keywords:
          $ref: "#/components/schemas/Keywords"
        readme:
          description: |
            Either the text of the readme (a string: untrusted Markdown of at most 64 KiB, as in `CommitPublishRequest`) or,
            at a registry that lists `group_readme_objects` in the `features` of `getHealth`, a `ReadmeRef` of a readme the
            caller PUT to the URL `createGroup` gave for it.

            The registry reads the object once the group's files are checked and before it stores anything. An object
            that is not in storage, or whose bytes differ in length or SHA-256 from the reference, is `upload_invalid`
            and names the member; bytes that are not UTF-8 text, or a reference that is not well formed, are
            `invalid_request` and name the member. Either refusal leaves the group `open`. The text read is then handled as
            an inline readme is (the same limits, the same sanitising rules, a leading byte order mark kept), so the
            version that results is the same as one committed with the text.

            A repeated commit must repeat the form of each member's readme: the string and the object are different
            requests, and a repeat in the other form is `group_commit_refused`. The comparison of a repeat reads no object.

            A registry from before `group_readme_objects` refuses a readme that is not a string with `invalid_request`,
            and the group stays `open`, so a client can send the text instead.
          oneOf:
            - type: "string"
              maxLength: 65536
            - $ref: "#/components/schemas/ReadmeRef"
    CommitGroupRequest:
      type: "object"
      required:
        - "members"
      properties:
        members:
          description: "One entry for each member of the group, and no other."
          type: "array"
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/CommitGroupMember"
    CommitGroupResponse:
      type: "object"
      required:
        - "group_id"
        - "status"
        - "attempt"
        - "status_url"
      properties:
        group_id:
          $ref: "#/components/schemas/GroupId"
        status:
          $ref: "#/components/schemas/GroupStatusName"
        attempt:
          type: "integer"
          minimum: 1
        status_url:
          description: "Path on the same host. GET it with the same token."
          type: "string"
          pattern: "^/api/v2/groups/"
    Group:
      type: "object"
      required:
        - "group_id"
        - "status"
        - "attempt"
        - "created_at"
        - "deadline_at"
        - "member_count"
        - "members"
      properties:
        group_id:
          $ref: "#/components/schemas/GroupId"
        status:
          $ref: "#/components/schemas/GroupStatusName"
        attempt:
          type: "integer"
          minimum: 1
        created_at:
          $ref: "#/components/schemas/Timestamp"
        deadline_at:
          $ref: "#/components/schemas/Timestamp"
        committed_at:
          $ref: "#/components/schemas/Timestamp"
        failure:
          description: "Why a group that was `rejected` or `failed` ended."
          type: "object"
          required:
            - "code"
            - "message"
          properties:
            code:
              description: "A rejection code of the validator, or one of `deadline_passed`, `upload_too_old`, `upload_missing`, `sha256_mismatch`, `limit_exceeded`, `operator`."
              type: "string"
            message:
              type: "string"
            member:
              description: "The package the verdict is about, when it is about one."
              type: "string"
        member_count:
          type: "integer"
          minimum: 1
        yank:
          description: "Present once the group has been yanked (`yankGroup`): where the yank is."
          type: "object"
          required:
            - "state"
            - "reason"
            - "requested_at"
            - "yanked_members"
          properties:
            state:
              description: "`yanking` and `unyanking` are running; `yanked` and `restored` are at rest."
              type: "string"
              enum:
                - "yanking"
                - "yanked"
                - "unyanking"
                - "restored"
            reason:
              type: "string"
              maxLength: 280
            requested_at:
              $ref: "#/components/schemas/Timestamp"
            yanked_members:
              description: "The members the yank has changed so far; an unyank restores these and no others."
              type: "integer"
              minimum: 0
        members:
          type: "array"
          items:
            type: "object"
            required:
              - "name"
              - "version"
              - "state"
            properties:
              name:
                $ref: "#/components/schemas/FullName"
              version:
                $ref: "#/components/schemas/Version"
              state:
                type: "string"
                enum:
                  - "pending"
                  - "reserved"
                  - "staged"
                  - "published"
                  - "yanked"
              files:
                description: |
                  Present on the answer of `getGroup` only (not on the answers of `abortGroup` and `yankGroup`, which omit it). The
                  files the caller declared for this member, sorted by `subdir` and `filename`, as the member's reserved version
                  holds them. Empty for a member that is not reserved yet, and for a member whose version number the registry no
                  longer holds for this group (the group ended and another group or publish took the number). A group is
                  declared with at most 500 members of at most 20 files each; the answer lists no more than the registry's current
                  member cap.
                type: "array"
                items:
                  type: "object"
                  required:
                    - "subdir"
                    - "filename"
                    - "sha256"
                    - "size"
                  properties:
                    subdir:
                      type: "string"
                    filename:
                      type: "string"
                    sha256:
                      $ref: "#/components/schemas/Sha256"
                    size:
                      type: "integer"
                      minimum: 1
                    uploaded:
                      description: |
                        Present only while the group is `open`: true when the file is in storage at its declared size (the same test
                        `createGroup` makes when it answers a repeated request). Absent for every other status, for which the
                        registry makes no storage check.
                      type: "boolean"
    YankRequest:
      type: "object"
      required:
        - "yanked"
      properties:
        yanked:
          type: "boolean"
        reason:
          description: "Required when `yanked` is true. Shown to people who locked the version."
          type: "string"
          maxLength: 280
      if:
        properties:
          yanked:
            const: true
      then:
        required:
          - "reason"
x-mopm-errors:
  invalid_request:
    status: 400
    message: "The request is not valid: {detail}."
    hint: "Check the request against the API documentation; update mopm if it is old."
  invalid_name:
    status: 400
    message: "'{name}' is not a valid package name."
    hint: "Names are lowercase letters, digits and underscores, 2 to 64 characters, starting with a letter."
  invalid_version:
    status: 400
    message: "'{version}' is not a valid version."
    hint: "A version is MAJOR.MINOR.PATCH: three numbers separated by dots, such as 1.2.3. Suffixes such as rc1 are not supported."
  upload_invalid:
    status: 400
    message: "The upload does not match what was declared: {detail}."
    hint: "Begin a new upload with the real file name, sha256 and size."
  token_missing:
    status: 401
    message: "This request needs a token."
    hint: "Run 'mopm login' or pass a token."
  token_unknown:
    status: 401
    message: "The token is not recognised."
    hint: "Create a new token with 'mopm token create', or run 'mopm login'."
  token_expired:
    status: 401
    message: "The token expired at {expires_at}."
    hint: "Create a new token."
  token_revoked:
    status: 401
    message: "The token was revoked."
    hint: "Create a new token."
  stale_session:
    status: 401
    message: "This action needs a login from the last 15 minutes."
    hint: "Run 'mopm login' again."
  oidc_token_invalid:
    status: 401
    message: "The CI identity token was rejected: {detail}."
    hint: "Check the audience and that the job has permission to request an identity token."
  scope_missing:
    status: 403
    message: "The token does not have the '{scope}' scope for '{name}'."
    hint: "Create a token with that scope and that package."
  not_owner:
    status: 403
    message: "You are not an owner of '{name}'."
    hint: "Use a token of an account that can write the namespace."
  name_reserved:
    status: 403
    message: "'{name}' is {what}."
    hint: "Choose another name."
  oidc_not_trusted:
    status: 403
    message: "No trusted publisher of '{name}' matches this CI identity."
    hint: "Register the repository, workflow and environment as a trusted publisher of the package."
  limit_exceeded:
    status: 403
    message: "Adding this file would put '{name}' over its storage limit of {limit} bytes; {remaining} bytes are left."
    hint: "Yanked versions still count toward the limit; only a takedown frees space. Reduce the package size."
  package_not_found:
    status: 404
    message: "There is no package '{name}'."
    hint: "Check the spelling; a package is created by publishing it."
  version_not_found:
    status: 404
    message: "'{name}' has no version '{version}'."
    hint: "List the versions with 'mopm info {name}'."
  device_code_unknown:
    status: 404
    message: "The device code is not recognised."
    hint: "Start the login again."
  token_not_found:
    status: 404
    message: "There is no such token."
    hint: "List yours with 'mopm token list'."
  publish_not_found:
    status: 404
    message: "There is no such publish."
    hint: "Publish ids are only valid for the caller who made them."
  group_not_found:
    status: 404
    message: "There is no such group."
    hint: "Group ids are only valid for the caller who made them, or for an owner of every package in the group."
  version_exists:
    status: 409
    message: "'{name}' {version} already exists (sha256 {sha256}); versions are immutable."
    hint: "Publish a new version."
  upload_used:
    status: 409
    message: "The upload '{upload_id}' was already used."
    hint: "Begin a new upload."
  group_not_open:
    status: 409
    message: "Group {group_id} is {status}; only an open group can be aborted."
    hint: "Create the group again with the same request to open it again."
  group_conflict:
    status: 409
    message: "The group cannot be created: {detail}."
    hint: "Abort or finish your other groups, or publish a new version."
  group_commit_refused:
    status: 409
    message: "The group cannot be committed: {detail}."
    hint: "Read the group with its status request; create it again with the same request to open it again."
  group_not_settled:
    status: 409
    message: "Group {group_id} cannot be yanked or unyanked now: {detail}."
    hint: "A group is yanked once it is visible, and not while another yank or unyank of it is running; read the group with its status request."
  invalid_transition:
    status: 409
    message: "Cannot {action} '{name}' {version}: it is {state}."
    hint: "Only a published version can be yanked, only a yanked version can be unyanked, and a tombstoned version never changes."
  payload_too_large:
    status: 413
    message: "The file is larger than the limit of {limit} bytes."
    hint: "Reduce the package size."
  rate_limited:
    status: 429
    message: "Too many requests."
    hint: "Wait {retry_after} seconds; the Retry-After header says how long."
  internal_error:
    status: 500
    message: "Something went wrong on our side."
    hint: "Try again; report the request id if it persists."
  read_only_mode:
    status: 503
    message: "The registry is read-only right now; new uploads are refused."
    hint: "Installs still work. Try again later."
  unavailable:
    status: 503
    message: "The registry is temporarily unavailable."
    hint: "Try again shortly."
  route_not_found:
    status: 404
    message: "There is no such operation."
    hint: "Check the request against the API documentation; update mopm if it is old."
  invalid_namespace:
    status: 400
    message: "'{namespace}' is not a valid namespace."
    hint: "A namespace is a GitHub login in lower case: letters, digits and single hyphens, at most 39 characters."
  not_namespace_member:
    status: 403
    message: "You cannot write in '{namespace}'."
    hint: "Ask an owner of '{namespace}' to run 'mopm org add {namespace} <your mopm username>'."
  namespace_reserved:
    status: 403
    message: "'{namespace}' is reserved."
    hint: "Publish in an organization's namespace."
  namespace_not_found:
    status: 404
    message: "There is no namespace '{namespace}'."
    hint: "A user's namespace is made at their first 'mopm login'; an organization's by one of its admins."
  namespace_taken:
    status: 409
    message: "'{namespace}' is taken."
    hint: "Choose the namespace of another GitHub organization."
  not_org_admin:
    status: 403
    message: "You are not an active admin of the GitHub organization '{namespace}'."
    hint: "An admin of the GitHub organization runs 'mopm org create {namespace}'; an organization that restricts OAuth apps approves the mopm registry first."
  github_account_mismatch:
    status: 403
    message: "The GitHub account that approved is not the one logged in to mopm."
    hint: "Approve with the GitHub account you logged in with, or run 'mopm login' with the other one."
  not_namespace_owner:
    status: 403
    message: "You are not an owner of '{namespace}'."
    hint: "Ask an owner of '{namespace}'; 'mopm org list {namespace}' shows them."
  last_owner:
    status: 409
    message: "'{user}' is the last owner of '{namespace}'."
    hint: "Make another member an owner first."
  member_not_found:
    status: 404
    message: "'{user}' is not a member of '{namespace}'."
    hint: "List the members with 'mopm org list {namespace}'."
  user_not_found:
    status: 404
    message: "There is no mopm user '{user}'."
    hint: "A user gets their name at their first 'mopm login'."
x-mopm-error-reasons:
  group_conflict:
    - "number_held"
    - "group_failed"
    - "open_cap"
    - "supersede_cap"
    - "takeover_blocked"
    - "number_taken"
    - "overlap_refused"
